/* -----------------------------------------------------------------
   Fontes de música
   - YOUTUBE: player oficial, sempre visível no cartão "Tocando agora"
     (o YouTube exige no mínimo 200 × 200 px para players incorporados).
   - UNDERFY_STORAGE: arquivo hospedado pelo Underfy (pasta musicas/ do site
     ou, no futuro, Firebase Storage).
   - EXTERNAL_AUTHORIZED: arquivo de outra fonte, com autorização registrada.
   Se a faixa tem arquivo próprio autorizado, ele toca no lugar do YouTube.
   Nunca tocam duas fontes ao mesmo tempo.
   ----------------------------------------------------------------- */
let yt=null,ytPronto=false,ytFalhou=false,pendente=null;
let atual=null,tocandoAgora=false,tick=null;
let aleatorio=false,pausaManual=false,ytApi=false,errosSeguidos=0,syncFeito=false;
let fonteAtual=null,tCarga=null,tAutoPulo=null,inicioCarga=0,vigia=null;
const audio=new Audio(); audio.preload="metadata";
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const fonteDe=t=>!t?null:t.src?(t.fonte||"UNDERFY_STORAGE"):t.vid?"YOUTUBE":null;
const NOME_FONTE={YOUTUBE:"YouTube",UNDERFY_STORAGE:"Underfy",EXTERNAL_AUTHORIZED:"Fonte autorizada"};
let VOL=(()=>{ const v=store.get("underfy.volume"); return typeof v==="number"?Math.min(100,Math.max(0,v)):85; })();
const $id=id=>document.getElementById(id);

window.onYouTubeIframeAPIReady=function(){
  ytApi=true;
  const vars={playsinline:1,rel:0,controls:1,fs:1};
  if(/^https?:$/.test(location.protocol)) vars.origin=location.origin;
  yt=new YT.Player("ytFrame",{width:"100%",height:"100%",playerVars:vars,
   events:{
     onReady:()=>{ ytPronto=true; try{ yt.setVolume(VOL); }catch(e){} if(pendente){ const p=pendente; pendente=null; tocar(p); } },
     onStateChange:e=>{
       if(fonteAtual!=="YOUTUBE") return;
       if(e.data===1){ errosSeguidos=0; pausaManual=false; fimCarga(); setUI(true); }
       if(e.data===2){ setUI(false); }
       if(e.data===0){ fimDoTrecho(); proxima(1); }
     },
     onError:e=>{ if(fonteAtual==="YOUTUBE") falhaFaixa(T(atual),e&&e.data); },
     onAutoplayBlocked:()=>{ if(fonteAtual!=="YOUTUBE") return; fimCarga(); setUI(false); toast("O navegador pediu um toque: aperte o play para começar."); }
   }});
  iniciarSync();
};
let catPronto=Promise.resolve();
function iniciarSync(){
  if(syncFeito||!ytApi||!USER) return; syncFeito=true;
  setTimeout(()=>{ catPronto.then(()=>sincronizarPlaylist(false)); },1200);
}
setTimeout(()=>{ if(!ytPronto) ytFalhou=true; },10000);

function setUI(v){
  tocandoAgora=v;
  $id("plWave").classList.toggle("static",!v);
  $id("plIcon").innerHTML=v?'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>':'<path d="M7 4l13 8-13 8z"/>';
  $id("plPlay").setAttribute("aria-label",v?"Pausar":"Reproduzir");
  clearInterval(tick); if(v) tick=setInterval(prog,500);
  atualizarMini();
  try{ if("mediaSession" in navigator) navigator.mediaSession.playbackState=v?"playing":"paused"; }catch(e){}
}

/* ---------- carregando / erro ---------- */
function iniciarCarga(t){
  clearTimeout(tCarga); clearTimeout(tAutoPulo);
  $id("plPlay").classList.add("carregando"); $id("np").classList.add("carregando");
  inicioCarga=Date.now();
  /* arquivo próprio: 20 s sem tocar é erro. YouTube: quem decide é o vigia (anúncio também "demora") */
  if(fonteDe(t)!=="YOUTUBE") tCarga=setTimeout(()=>{ if(atual===t.id&&!tocandoAgora) falhaFaixa(t,"tempo"); },20000);
}
function fimCarga(){ clearTimeout(tCarga); $id("plPlay").classList.remove("carregando"); $id("np").classList.remove("carregando"); }
const MOTIVOS={2:"o endereço desta faixa é inválido",5:"este navegador não conseguiu tocar a faixa",100:"o vídeo foi removido ou ficou privado",
  101:"quem publicou não deixa tocar fora do YouTube",150:"quem publicou não deixa tocar fora do YouTube",153:"o YouTube recusou a origem do site",
  tempo:"a faixa demorou demais para carregar",arquivo:"o arquivo de áudio não abriu",semyt:"o player do YouTube não carregou"};
const linkOrigem=t=>t&&t.vid?"https://www.youtube.com/watch?v="+t.vid:(t&&t.src)||"";
function falhaFaixa(t,cod){
  fimCarga(); setUI(false); sairAnuncio(); clearInterval(vigia);
  if(!t) return;
  if(cod!=="tempo"&&cod!=="semyt") t.indisponivel=true;
  errosSeguidos++;
  $id("plArtist").textContent=t.a+" · indisponível aqui";
  const acoes=[];
  if(linkOrigem(t)) acoes.push({txt:t.vid?"Abrir no YouTube":"Abrir arquivo",fn:()=>window.open(linkOrigem(t),"_blank","noopener")});
  if(cod==="tempo"||cod==="semyt") acoes.push({txt:"Tentar de novo",fn:()=>tocar(t.id)});
  else acoes.push({txt:"Próxima",fn:()=>proxima(1)});
  toastAcao("Não deu para tocar “"+t.t+"”: "+(MOTIVOS[cod]||"erro desconhecido")+".",acoes);
  /* faixa bloqueada pelo dono: segue para a próxima sozinho (até 3 seguidas, para não ficar em looping) */
  if(cod!=="tempo"&&cod!=="semyt"&&errosSeguidos<=3){
    const id=t.id; tAutoPulo=setTimeout(()=>{ if(atual===id) proxima(1); },4500);
  }
}
function toastAcao(msg,acoes){
  const box=$id("toasts"),t=document.createElement("div");
  t.className="toast acao"; t.setAttribute("role","alert");
  t.innerHTML='<span></span><span class="toast-acts"></span>';
  t.querySelector("span").textContent=msg;
  const sair=()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); };
  acoes.forEach(a=>{ const b=document.createElement("button"); b.textContent=a.txt;
    b.onclick=()=>{ clearTimeout(tAutoPulo); sair(); a.fn(); }; t.querySelector(".toast-acts").appendChild(b); });
  box.appendChild(t); setTimeout(sair,7000);
}
window.addEventListener("offline",()=>toast("Sem conexão. A música volta a tocar quando a internet voltar."));
window.addEventListener("online",()=>toast("Conexão de volta."));

/* ---------- cartão "Tocando agora" ---------- */
function capaUrl(t,q){ return !t?"":t.capa||(t.vid?thumb(t.vid,q||"hqdefault"):""); }
function posicionarNp(){
  const np=$id("np"), bar=document.querySelector(".ap-player"), top=$id("top"); if(!np||!bar) return;
  np.style.setProperty("--npb",(innerHeight-bar.getBoundingClientRect().top+10)+"px");
  if(top) np.style.setProperty("--npt",(Math.max(0,top.getBoundingClientRect().bottom)+8)+"px");
}
const CANTOS=["c-br","c-bl","c-tr","c-tl"];
function definirCanto(c){
  const np=$id("np"); if(!CANTOS.includes(c)) c="c-br";
  CANTOS.forEach(x=>np.classList.toggle(x,x===c)); store.set("underfy.canto",c);
}
function ligarArraste(){
  const np=$id("np"), h=$id("npHead"); let ini=null;
  h.addEventListener("pointerdown",e=>{
    if(!matchMedia("(max-width:900px)").matches||np.classList.contains("grande")||e.target.closest("button")) return;
    const r=np.getBoundingClientRect(); ini={x:e.clientX,y:e.clientY,l:r.left,t:r.top};
    np.classList.add("arrastando"); try{ h.setPointerCapture(e.pointerId); }catch(_){}
  });
  h.addEventListener("pointermove",e=>{
    if(!ini) return;
    np.style.transform="translate("+(e.clientX-ini.x)+"px,"+(e.clientY-ini.y)+"px)";
  });
  const soltar=e=>{
    if(!ini) return;
    const cx=ini.l+(e.clientX-ini.x)+np.offsetWidth/2, cy=ini.t+(e.clientY-ini.y)+np.offsetHeight/2;
    ini=null; np.classList.remove("arrastando"); np.style.transform="";
    definirCanto((cy<innerHeight/2?"c-t":"c-b")+(cx<innerWidth/2?"l":"r"));
  };
  h.addEventListener("pointerup",soltar); h.addEventListener("pointercancel",soltar);
}
function fecharNp(){
  /* o YouTube não permite tocar com o vídeo escondido: fechar o vídeo pausa a música */
  if(fonteAtual==="YOUTUBE"){ pausaManual=true; try{ yt.pauseVideo(); }catch(e){} }
  $id("np").classList.add("oculto");
  toast("Vídeo fechado e música pausada. Aperte o play para voltar.");
}
window.addEventListener("resize",posicionarNp);
function pintarNp(t){
  const np=$id("np"), f=fonteDe(t);
  np.classList.remove("vazio","oculto"); document.body.classList.add("np-on");
  np.classList.toggle("arquivo",f!=="YOUTUBE");
  $id("npSrc").textContent=NOME_FONTE[f]||"";
  const capa=$id("npCapa"); if(f!=="YOUTUBE"){ capa.src=capaUrl(t)||""; capa.hidden=!capa.src; } else capa.hidden=true;
  const ext=$id("npExt"); ext.href=linkOrigem(t); ext.hidden=!ext.href||f!=="YOUTUBE";
  if(clipOn) desligarClipe();
  const v=$id("npClip"); if(v.getAttribute("src")&&v.getAttribute("src")!==t.video){ v.removeAttribute("src"); try{ v.load(); }catch(e){} }
  pintarClipeBtn(t);
  posicionarNp();
}
function pintarFaixa(t){
  $id("plTitle").textContent=t.t;
  $id("plArtist").textContent=t.a+" · "+(NOME_FONTE[fonteDe(t)]||"");
  $id("plLike").classList.toggle("on",DADOS.curtidas.includes(t.id));
  const art=$id("plArt"), u=capaUrl(t,"mqdefault");
  art.innerHTML=u?'<img alt="" src="'+u+'">':svgCover(3).replace('class="cover "','');
  art.setAttribute("aria-label","Capa de "+t.t);

function npGrande(v){
  const np=$id("np"); np.classList.toggle("grande",v);
  $id("npSize").setAttribute("aria-label",v?"Diminuir vídeo":"Aumentar vídeo");
  $id("npSize").innerHTML=v?'<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 20v-5h5"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5"/></svg>';
  posicionarNp();
}

/* ---------- anúncios do YouTube ----------
   O Underfy não pula o anúncio sozinho: o botão "Pular" é do YouTube e fica dentro do vídeo.
   Como o vídeo agora está sempre visível, o "Pular" fica ao alcance de um toque.
   O Underfy percebe o anúncio pela duração do trecho que está tocando
   (anúncios costumam ter de 6 a 60 s; e o Underfy aprende a duração real de cada música),
   acende o aviso e aponta onde fica o botão. */
const LIMITE_AD=61;
const DURS=store.get("underfy.duracoes")||{};
let trecho=null, emAnuncio=false, adAuto=false;
function salvarDurs(){ const ks=Object.keys(DURS); if(ks.length>600) ks.slice(0,ks.length-600).forEach(k=>delete DURS[k]); store.set("underfy.duracoes",DURS); }
function julgarTrecho(vid,trocou,anterior){
  const d=trecho.d, k=DURS[vid];
  let ad;
  if(k&&!(trocou&&anterior&&!anterior.ad&&d>k+2)) ad=Math.abs(d-k)>2;
  else if(trocou&&anterior) ad=anterior.ad?false:d<=LIMITE_AD;
  else ad=d<=LIMITE_AD;
  /* trocou de trecho e o novo é maior que o anterior "conteúdo": o anterior era um anúncio longo */
  if(trocou&&anterior&&!anterior.ad&&k&&d>k+2){ ad=false; }
  trecho.ad=ad;
  if(ad) entrarAnuncio(); else sairAnuncio();
}
function vigiarAnuncio(t,c,d){
  if(!(d>0)) return;
  if(!trecho){ trecho={d:d,c:c}; julgarTrecho(t.vid,false,null); return; }
  /* a duração mudou: começou outro trecho (anúncio entrando ou a música voltando) */
  if(Math.abs(d-trecho.d)>2){ const ant=trecho; trecho={d:d,c:c}; julgarTrecho(t.vid,true,ant); return; }
  trecho.c=c;
  /* música confirmada tocando há 15 s: aprende a duração dela */
  if(!trecho.ad&&c>15&&!DURS[t.vid]&&d>LIMITE_AD){ DURS[t.vid]=Math.round(d); salvarDurs(); }
}
function fimDoTrecho(){
  const t=T(atual);
  if(trecho&&trecho.ad&&t&&t.vid&&!DURS[t.vid]){ DURS[t.vid]=Math.round(trecho.d); salvarDurs(); }   /* era uma música curta */
  sairAnuncio();
}
function entrarAnuncio(){
  if(emAnuncio) return; emAnuncio=true;
  document.querySelector(".ap-player").classList.add("ad"); $id("np").classList.add("ad","flash");
  $id("np").classList.remove("oculto");
  /* no celular o vídeo cresce durante o anúncio, para o Pular ficar fácil de tocar; depois volta */
  if(matchMedia("(max-width:900px)").matches&&!$id("np").classList.contains("grande")){ adAuto=true; npGrande(true); }
  pintarSkip(0);
}
function sairAnuncio(){
  if(!emAnuncio) return; emAnuncio=false;
  document.querySelector(".ap-player").classList.remove("ad"); $id("np").classList.remove("ad");
  $id("plSkip").classList.remove("pronto");
  if(adAuto){ adAuto=false; npGrande(false); }
}
function pintarSkip(c){
  const falta=Math.max(0,Math.ceil(5-(c||0)));
  const b=$id("plSkip"), cel=matchMedia("(max-width:900px)").matches;
  const seta=cel?"↑":"↙";
  b.innerHTML=falta?"Pular em "+falta+" s":'Pular no vídeo<span class="seta">'+seta+'</span>';
  b.setAttribute("aria-label",falta?"O YouTube libera o pulo em "+falta+" segundos":"Mostrar o botão Pular do YouTube no vídeo");
  b.classList.toggle("pronto",!falta);
  $id("npAdTxt").textContent=falta?"O YouTube libera o Pular em "+falta+" s":"Toque em Pular no canto do vídeo ↘";
}
/* vigia do YouTube: a cada meio segundo, desde o play.
   Não depende do estado "tocando", porque durante o anúncio o YouTube pode informar outro estado. */
const DIAG=/[?&#]diag/.test(location.search+location.hash);
let diagEl=null, diagUlt="";
function lerYT(){
  const g=(f,v)=>{ try{ return typeof yt[f]==="function"?yt[f]():v; }catch(e){ return v; } };
  const vd=g("getVideoData",null);
  return {st:g("getPlayerState",-9),c:+g("getCurrentTime",0)||0,d:+g("getDuration",0)||0,lf:+g("getVideoLoadedFraction",0)||0,vid:vd&&vd.video_id||"",tit:vd&&vd.title||""};
}
function iniciarVigia(){ clearInterval(vigia); vigia=setInterval(vigiar,500); }
function vigiar(){
  const t=T(atual);
  if(!t||fonteAtual!=="YOUTUBE"||!ytPronto||!yt){ clearInterval(vigia); return; }
  const y=lerYT();
  if(DIAG) pintarDiag(t,y);
  /* sem nenhum sinal de vida em 25 s: aí sim é erro de carregamento */
  if(!tocandoAgora&&Date.now()-inicioCarga>25000&&!(y.d>0)&&!(y.lf>0)&&(y.st===-1||y.st===5||y.st===-9)){ falhaFaixa(t,"tempo"); return; }
  if(y.st===1||y.st===3||(y.d>0&&y.c>0)){
    if(y.st===1||y.c>0) fimCarga();
    vigiarAnuncio(t,y.c,y.d);
    if(emAnuncio) pintarSkip(y.c);
  }
}
function pintarDiag(t,y){
  if(!diagEl){
    diagEl=document.createElement("div");
    diagEl.style.cssText="position:fixed;left:8px;top:8px;z-index:500;background:rgba(0,0,0,.85);color:#00F5D4;font:12px/1.45 monospace;padding:8px 10px;border-radius:8px;max-width:300px;white-space:pre-wrap;pointer-events:auto";
    document.body.appendChild(diagEl);
  }
  const linha="estado "+y.st+" | tempo "+y.c.toFixed(1)+" | duração "+y.d.toFixed(1)+" | carregado "+y.lf.toFixed(2)+"\nvídeo "+(y.vid||"-")+(y.vid&&y.vid!==t.vid?" (DIFERENTE da música!)":"")+"\nanúncio? "+(emAnuncio?"SIM":"não")+" | duração aprendida "+(DURS[t.vid]||"-");
  diagEl.textContent="DIAGNÓSTICO DO PLAYER\n"+linha;
  if(linha!==diagUlt){ diagUlt=linha; (window.__diagLog=window.__diagLog||[]).push(new Date().toLocaleTimeString()+" "+linha.replace(/\n/g," / ")); }
}
function apertarSkip(){
  const np=$id("np");
  if(matchMedia("(max-width:900px)").matches&&!np.classList.contains("grande")){ adAuto=true; npGrande(true); }
  else np.scrollIntoView({block:"nearest",behavior:"smooth"});
  np.classList.remove("flash"); void np.offsetWidth; np.classList.add("flash");
}

function prog(){
  const t=T(atual); if(!t) return;
  let c=0,d=0;
  if(fonteAtual==="YOUTUBE"){
    if(!yt||!yt.getDuration) return;
    if(emAnuncio) return;
    c=yt.getCurrentTime()||0; d=yt.getDuration()||0;
  } else { c=audio.currentTime||0; d=isFinite(audio.duration)?audio.duration:0; syncClipe(false); }
  if(!d) return;
  $id("plFill").style.width=(c/d*100)+"%";
  $id("plNow").textContent=fmt(c);
  $id("plDur").textContent=fmt(d);
  if(mini&&!mini.closed){ const b=mini.document.getElementById("mF"); if(b) b.style.width=(c/d*100)+"%"; }
}

/* ---------- arquivos de áudio (Underfy e fontes autorizadas) ---------- */
audio.addEventListener("playing",()=>{ if(fonteAtual==="YOUTUBE") return; errosSeguidos=0; pausaManual=false; fimCarga(); setUI(true); syncClipe(true); });
audio.addEventListener("pause",()=>{ if(fonteAtual!=="YOUTUBE"){ setUI(false); syncClipe(false); } });
audio.addEventListener("waiting",()=>{ if(fonteAtual!=="YOUTUBE"){ $id("plPlay").classList.add("carregando"); } });
audio.addEventListener("ended",()=>{ if(fonteAtual!=="YOUTUBE") proxima(1); });
audio.addEventListener("error",()=>{ if(fonteAtual!=="YOUTUBE"&&audio.getAttribute("src")) falhaFaixa(T(atual),"arquivo"); });
/* ---------- clipe ----------
   O som sempre vem do arquivo de áudio (é ele que continua tocando com a tela bloqueada).
   O clipe toca sem som, acompanhando o tempo do áudio. */
let clipOn=false;
function pintarClipeBtn(t){
  const b=$id("npClipBtn"), tem=!!(t&&t.video&&fonteDe(t)!=="YOUTUBE");
  b.hidden=!tem; if(!tem){ desligarClipe(); return; }
  if(store.get("underfy.clipe")===true) ligarClipe(false);
}
function ligarClipe(crescer){
  const t=T(atual); if(!t||!t.video) return;
  const v=$id("npClip");
  if(v.getAttribute("src")!==t.video){ v.src=t.video; }
  v.hidden=false; clipOn=true; $id("npClipBtn").classList.add("on");
  $id("npClipBtn").setAttribute("aria-label","Esconder o clipe");
  if(crescer&&!$id("np").classList.contains("grande")) npGrande(true);
  syncClipe(true);
}
function desligarClipe(){
  const v=$id("npClip"); clipOn=false;
  try{ v.pause(); }catch(e){} v.hidden=true;
  const b=$id("npClipBtn"); b.classList.remove("on"); b.setAttribute("aria-label","Ver o clipe");
}
function syncClipe(forcar){
  if(!clipOn) return;
  const v=$id("npClip");
  if(audio.paused){ if(!v.paused) v.pause(); return; }
  if(v.paused) v.play().catch(()=>{});
  if(v.readyState<1){ if(!v._esperando){ v._esperando=true; v.addEventListener("loadedmetadata",()=>{ v._esperando=false; syncClipe(true); },{once:true}); } return; }
  if(v.seeking) return;   /* não reposiciona de novo enquanto o vídeo ainda está indo para o ponto certo */
  const sk=v.seekable; if(!sk.length||sk.end(sk.length-1)<audio.currentTime) return;   /* servidor sem suporte a pular: deixa o clipe correr */
  if(forcar||Math.abs((v.currentTime||0)-(audio.currentTime||0))>0.35){ try{ v.currentTime=audio.currentTime; }catch(e){} }
}
audio.addEventListener("seeked",()=>syncClipe(true));
function pararArquivo(){ try{ audio.pause(); audio.removeAttribute("src"); audio.load(); }catch(e){} }
function pararYouTube(){ try{ if(yt&&ytPronto) yt.stopVideo(); }catch(e){} }

function tocar(id){
  const t=T(id); if(!t) return;
  const f=fonteDe(t); if(!f) return;
  atual=id; clearTimeout(tAutoPulo);
  pintarFaixa(t); pintarNp(t);
  if(t.au) descobrir(t.au);
  trecho=null; sairAnuncio();
  DADOS.ultima=id; DADOS.recentes=[id].concat((DADOS.recentes||[]).filter(x=>x!==id)).slice(0,24); salvar();
  sessaoMidia();
  /* nunca duas fontes ao mesmo tempo */
  fonteAtual=f;
  if(f==="YOUTUBE") pararArquivo(); else { pararYouTube(); clearInterval(vigia); }
  setUI(false); iniciarCarga(t); atualizarMini();
  if(f==="YOUTUBE"){
    if(!ytPronto){ if(!ytFalhou){ pendente=id; return; } falhaFaixa(t,"semyt"); return; }
    try{ yt.setVolume(VOL); yt.loadVideoById(t.vid); iniciarVigia(); }catch(e){ falhaFaixa(t,"semyt"); }
  } else {
    audio.src=t.src; audio.volume=VOL/100;
    audio.play().catch(e=>{
      if(e&&e.name==="NotAllowedError"){ fimCarga(); setUI(false); toast("O navegador pediu um toque: aperte o play para começar."); }
      else if(e&&e.name!=="AbortError") falhaFaixa(t,"arquivo");
    });
  }
  render();
}
function proxima(dir){
  const t=T(atual);
  const ok=id=>T(id)&&!T(id).indisponivel;
  const L=(FILA&&FILA.includes(atual))?FILA.filter(id=>ok(id)||id===atual):null;
  if(aleatorio){
    const base=(L||idsReais).filter(ok);
    if(base.length>1){ let r; do{ r=base[Math.floor(Math.random()*base.length)]; }while(r===atual); tocar(r); }
    return;
  }
  if(L){
    const i=L.indexOf(atual)+(dir===-1?-1:1);
    if(i>=0&&i<L.length){ tocar(L[i]); return; }
  }
  if(dir===-1){
    if(fonteAtual==="YOUTUBE"){ try{ yt.seekTo(0,true); }catch(e){} } else { try{ audio.currentTime=0; }catch(e){} }
    return;
  }
  /* acabou a fila: segue tocando pelas recomendações, como um rádio */
  const r=recomendar(1,[atual].concat((DADOS.recentes||[]).slice(0,15)))[0];
  FILA=null; if(r) tocar(r.id);
}
function alternar(){

/* =================================================================
   15b. FOTO DE PERFIL
   A imagem é recortada no centro (quadrado) e reduzida no próprio aparelho:
   uma de 320px para o perfil e uma de 96px para ícones pequenos. Fica na conta.
   ================================================================= */
function lerImagem(file){
  return new Promise((ok,er)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); ok(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); er(new Error("imagem")); };
    img.src=url;
  });
}
function recortar(img,lado,q){
  const c=document.createElement("canvas"); c.width=c.height=lado;
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height, s=Math.min(w,h);
  const g=c.getContext("2d"); g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";
  g.fillStyle="#1A1523"; g.fillRect(0,0,lado,lado);
  g.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,lado,lado);
  return c.toDataURL("image/jpeg",q);
}
async function aplicarFoto(file){
  if(!file) return;
  const ehImagem=/^image\//.test(file.type||"")||/\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i.test(file.name||"");
  if(!ehImagem){ toast("Escolha um arquivo de imagem (JPG, PNG ou WEBP)."); return; }
  if(file.size>25*1024*1024){ toast("Essa imagem passa de 25 MB. Escolha uma menor."); return; }
  try{
    const img=await lerImagem(file);
    DADOS.foto=recortar(img,320,.86); DADOS.fotoMini=recortar(img,96,.82);
    salvarJa(); pintarFotos(); toast("Foto de perfil atualizada.");
  }catch(e){ toast("Não consegui abrir essa imagem. Tente uma foto em JPG ou PNG."); }
}
function pintarFotos(){
  render();
  const b=document.querySelector("#onb .onb-foto");
  if(b) b.innerHTML=avEu("lg")+'<span>'+(DADOS.foto?"Trocar foto":"Adicionar foto")+'</span>';
}

  };
  $("auGo").onclick=go;
  ["auUser","auPw","auPw2"].forEach(id=>{ const el=$(id); if(el) el.onkeydown=e=>{ if(e.key==="Enter") go(); }; });
  $("auUser").focus();
}
function modalSenha(){
  const {ov,close}=baseModal('<h3>Trocar senha</h3><p class="m-sub"></p>'+
   '<div class="field"><label for="snA">Senha atual</label><input id="snA" type="password" autocomplete="current-password"></div>'+
   '<div class="field"><label for="snN">Nova senha</label><input id="snN" type="password" autocomplete="new-password" placeholder="mínimo de 6 caracteres"></div>'+
   '<div class="field"><label for="snN2">Repita a nova senha</label><input id="snN2" type="password" autocomplete="new-password"></div>'+
   '<p class="auth-err" id="snErr" role="alert"></p>'+
   '<div class="modal-acts"><button class="btn btn-ghost btn-sm" data-x>Cancelar</button>'+
   '<button class="btn btn-primary btn-sm" id="snGo">Salvar nova senha</button></div>');
  ov.querySelector(".m-sub").textContent="Conta "+USER+".";
  ov.querySelector("[data-x]").onclick=close;
  const q=id=>ov.querySelector("#"+id);
  q("snGo").onclick=async()=>{
    const a=q("snA").value, n=q("snN").value, err=q("snErr");
    if(!a){ err.textContent="Digite a senha atual."; return; }
    if(n.length<6){ err.textContent="A nova senha precisa ter pelo menos 6 caracteres."; return; }
    if(n!==q("snN2").value){ err.textContent="As duas senhas novas não são iguais."; return; }
    q("snGo").disabled=true;
    try{ await DB.trocarSenha(a,n); close(); toast("Senha alterada."); }
    catch(e){ err.textContent=(e&&/credential|wrong-password|credencial/.test(String(e.code)))?"A senha atual não confere.":erroAuth(e); q("snGo").disabled=false; }
  };
  q("snA").focus();
}
function aplicarVagas(){
  (DADOS.vagas||[]).forEach(v=>{
    const [pid,i]=String(v).split(":"), pr=projetos.find(x=>x.id===pid);
    if(pr&&pr.slots[i]&&!pr.slots[i].ok){ pr.slots[i].ok=true; pr.slots[i].quem="eu"; }
  });
}
function pintarUltima(){
  const t=DADOS.ultima?T(DADOS.ultima):null; if(!t||atual) return;
  document.getElementById("plTitle").textContent=t.t;
  document.getElementById("plArtist").textContent=t.a+" · toque em play para continuar";
}
async function abrirApp(u,novo){
  USER=u;
  let d=null; try{ d=await DB.lerDados(); }catch(e){}
  DADOS=Object.assign(dadosPadrao(),d||{});
  ["curtidas","salvos","seguindo","seguindoArt","playlists","descobertos","eventos","vagas","recentes"].forEach(k=>{ if(!Array.isArray(DADOS[k])) DADOS[k]=[]; });
  if(!DADOS.coments||typeof DADOS.coments!=="object") DADOS.coments={};
  aplicarVagas();
  document.getElementById("auth").hidden=true;
  document.getElementById("app").hidden=false;
  montarNav(); ligarPlayer(); ir("inicio"); pintarUltima();
  if(!DADOS.onboard) abrirOnboarding();
  toast(novo?"Conta criada. Bem-vindo ao Underfy, "+u+".":"Bem-vindo de volta, "+u+".");
  catPronto=DB.lerCatalogo().then(c=>{
    if(c&&Array.isArray(c.faixas)&&c.faixas.length>=REAL.length&&FONTE_CAT!=="playlist"){ aplicarCatalogo(c.faixas,"nuvem"); pintarUltima(); }
  }).catch(()=>{});
  DB.listarPosts().then(l=>{ postsUsuarios=l||[]; if(view==="feed") render(); }).catch(()=>{});
  completarMeta().catch(()=>{});
  iniciarSync();
}
