<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underfy — a cena que ninguém te mostrou</title>
<meta name="description" content="Plataforma de colaboração entre artistas independentes do underground: música, poesia, microconto e arte visual.">
<meta name="theme-color" content="#120E16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Underfy">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 156 110'%3E%3Cpath d='M6 55 L20 55 L26 44 L32 66 L38 38 L44 72 L50 30 L50 66 C50 90 96 90 96 66 L96 26 L103 78 L110 34 L117 70 L124 46 L131 60 L138 55 L150 55' fill='none' stroke='%239D4EDD' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120E16; --surface:#1A1523; --surface-2:#221B2E; --surface-3:#2C2340;
  --line:#2E2540; --purple:#9D4EDD; --cyan:#00F5D4;
  --text:#F3EFF5; --muted:#8B8594;
  --radius:14px; --radius-sm:8px;
  --fd:"Chakra Petch",system-ui,sans-serif;
  --fb:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;line-height:1.15;letter-spacing:-.01em}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
::selection{background:var(--purple);color:#fff}
[hidden]{display:none!important}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#3d3054}

.mark{display:block;overflow:visible}
.mark path{fill:none;stroke:currentColor;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.lockup{display:flex;align-items:center;gap:.55em}
.lockup .wordmark{font-family:var(--fd);font-weight:700;letter-spacing:.14em;text-transform:uppercase;transform:skewX(-6deg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:99px;font-family:var(--fd);font-weight:600;letter-spacing:.02em;transition:transform .12s,background .18s,border-color .18s,color .18s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:#ad63e8}
.btn-ghost{border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple)}
.btn-cyan{background:var(--cyan);color:#08201c}
.btn-cyan:hover{background:#4dfae0}
.btn-sm{padding:.44rem .95rem;font-size:.87rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============ LOGIN ============ */
.auth{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:22px;overflow-y:auto;
  background:radial-gradient(ellipse at 20% 0%,rgba(157,78,221,.28),transparent 60%),radial-gradient(ellipse at 90% 100%,rgba(0,245,212,.12),transparent 55%),var(--bg)}
.auth-box{width:100%;max-width:430px;margin:auto}
.auth-box .lockup{color:var(--purple);font-size:34px;justify-content:center;margin-bottom:10px}
.auth-box .wordmark{color:var(--text);font-size:30px}
.auth-tag{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:30px}
.auth-card{background:rgba(26,21,35,.86);border:1px solid var(--line);border-radius:20px;padding:26px;backdrop-filter:blur(10px)}
.auth-card h2{font-size:1.2rem;margin-bottom:5px}
.auth-card .sub{color:var(--muted);font-size:.87rem;margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-family:var(--fd);font-size:.82rem;color:var(--muted);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;outline:none;transition:border-color .18s;font-size:.94rem}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--purple)}
.field textarea{resize:vertical;min-height:92px;line-height:1.6}
.auth-err{color:#ff8fa3;font-size:.85rem;margin-bottom:12px;min-height:1.2em}
.auth-foot{margin-top:18px;text-align:center;font-size:.83rem;color:var(--muted)}
.auth-foot button{color:var(--cyan);text-decoration:underline;text-underline-offset:3px}
.auth-note{margin-top:20px;font-size:.78rem;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:16px}
.auth-note b{color:var(--text);font-family:var(--fd)}

/* ============ SHELL ============ */
.ap{position:fixed;inset:0;display:grid;background:var(--bg);grid-template-columns:238px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 78px;grid-template-areas:"side main" "player player"}
@media(max-width:900px){.ap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"main" "player" "side"}}
.ap-side{grid-area:side;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
.ap-side .lockup{color:var(--purple);font-size:19px;padding:6px 10px 18px}
.ap-side .wordmark{color:var(--text);font-size:19px}
.ap-nav{display:flex;flex-direction:column;gap:2px}
.nav-sep{height:1px;background:var(--line);margin:10px 12px}
.navbtn{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--muted);font-family:var(--fd);font-weight:500;font-size:.95rem;transition:background .16s,color .16s;width:100%;text-align:left}
.navbtn svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:var(--text);background:var(--surface-2)}
.navbtn.on{color:var(--purple);background:rgba(157,78,221,.12)}
.lvl-box{margin-top:auto;border:1px solid var(--line);border-radius:var(--radius);padding:13px;font-size:.8rem;color:var(--muted)}
.lvl-box b{display:block;font-family:var(--fd);color:var(--cyan);font-size:.88rem;margin-bottom:3px}
.lvl-bar{height:5px;border-radius:99px;background:var(--surface-2);margin:9px 0 6px;overflow:hidden}
.lvl-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:99px;transition:width .6s}
@media(max-width:900px){
  .ap-side{flex-direction:row;border-right:none;border-top:1px solid var(--line);padding:6px 3px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:#15111d;overflow:visible}
  .ap-side .lockup,.lvl-box,.nav-sep,.desk-only{display:none}
  .ap-nav{flex-direction:row;width:100%;gap:0}
  .navbtn{flex-direction:column;gap:4px;font-size:.64rem;padding:7px 2px;justify-content:center;text-align:center;letter-spacing:0}
  .navbtn svg{width:21px;height:21px;flex:0 0 21px}
}
.ap-main{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.glow{position:absolute;top:0;left:0;right:0;height:430px;pointer-events:none;transition:opacity .35s;background:linear-gradient(180deg,rgba(157,78,221,.22),rgba(157,78,221,0) 78%)}
.ap-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 26px;background:rgba(18,14,22,.72);backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .25s,background .25s}
.ap-top.stuck{border-bottom-color:var(--line);background:rgba(18,14,22,.94)}
@media(max-width:640px){.ap-top{padding:10px 14px}}
.ap-search{flex:1;max-width:400px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 16px;transition:border-color .18s}
.ap-search:focus-within{border-color:var(--purple)}
.ap-search input{background:none;border:none;outline:none;width:100%;font-size:.93rem;min-width:0}
.ap-search input::placeholder{color:var(--muted)}
.ap-search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 17px}
.ap-me{margin-left:auto;display:flex;align-items:center;gap:9px}
.ap-page{padding:22px 26px 44px;position:relative;z-index:1}
@media(max-width:640px){.ap-page{padding:16px 14px 34px}}
.mobile-logo{display:none}
@media(max-width:900px){.mobile-logo{display:flex;color:var(--purple);font-size:16px}.mobile-logo .wordmark{color:var(--text);font-size:16px}.ap-search{max-width:none}}
@media(max-width:600px){.ap-top .mobile-logo,.ap-top .hide-xs{display:none}}
.ap-h{font-size:1.55rem;margin-bottom:6px}
.ap-sub{color:var(--muted);font-size:.94rem;margin-bottom:22px;max-width:46em}
.sec-h{font-size:1.18rem;margin:28px 0 13px}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.88rem;margin-bottom:16px}
.back:hover{color:var(--text)}

/* ============ CAPAS ============ */
.cover{width:100%;aspect-ratio:1;display:block;border-radius:7px;background:var(--surface-2);object-fit:cover}
.cover.round{border-radius:99px}

/* ============ ARTISTA DA SEMANA ============ */
.week{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:34px;background:var(--surface)}
.week-bg{position:absolute;inset:0;opacity:.5}
.week-in{position:relative;display:flex;gap:26px;align-items:center;padding:28px;background:linear-gradient(100deg,rgba(18,14,22,.95) 35%,rgba(18,14,22,.6))}
.week-av{width:132px;height:132px;flex:0 0 132px;border-radius:99px;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:2.4rem;color:#fff;box-shadow:0 0 0 4px rgba(18,14,22,.9),0 0 46px rgba(157,78,221,.55)}
.week-tag{font-family:var(--fd);font-size:.74rem;letter-spacing:.14em;color:var(--cyan);display:block;margin-bottom:8px}
.week h2{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:5px}
.week .loc{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.week p{color:var(--muted);font-size:.93rem;max-width:40em;margin-bottom:18px}
.week-acts{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:720px){.week-in{flex-direction:column;align-items:flex-start;padding:22px;gap:18px}.week-av{width:96px;height:96px;flex:0 0 96px;font-size:1.8rem}}

/* ============ ATALHOS ============ */
.jump{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:34px}
@media(max-width:820px){.jump{grid-template-columns:repeat(2,1fr)}}
.jbox{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:border-color .18s,background .18s;text-align:left}
.jbox:hover{border-color:var(--purple);background:var(--surface-2)}
.jbox .em{font-size:1.4rem;line-height:1;flex:0 0 auto}
.jbox strong{display:block;font-family:var(--fd);font-size:.95rem}
.jbox span{font-size:.79rem;color:var(--muted);display:block;line-height:1.35}

/* ============ QUICK PICKS ============ */
.qp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:34px}
@media(max-width:1100px){.qp{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.qp{grid-template-columns:1fr}}
.qpc{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:7px;overflow:hidden;height:62px;transition:background .18s;text-align:left;position:relative}
.qpc:hover{background:var(--surface-3)}
.qpc .cover{width:62px;height:62px;flex:0 0 62px;border-radius:0;aspect-ratio:auto}
.qpc-txt{min-width:0;padding-right:48px}
.qpc strong{display:block;font-family:var(--fd);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qpc span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qpc .fab{position:absolute;right:11px;top:50%;transform:translateY(-50%) scale(.85);opacity:0;transition:.18s}
.qpc:hover .fab{opacity:1;transform:translateY(-50%) scale(1)}

/* ============ PRATELEIRAS ============ */
.shelf{margin-bottom:32px}
.shelf-head{display:flex;align-items:baseline;gap:14px;margin-bottom:13px}
.shelf-head h2{font-size:1.24rem}
.shelf-head p{font-size:.84rem;color:var(--muted);margin-left:auto;white-space:nowrap}
@media(max-width:640px){.shelf-head p{display:none}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:166px;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding-bottom:8px;margin:0 -8px;padding-inline:8px}
@media(max-width:560px){.rail{grid-auto-columns:141px}}
.rail>*{scroll-snap-align:start}
.tile{padding:10px;border-radius:9px;transition:background .18s;text-align:left;width:100%}
.tile:hover{background:var(--surface-2)}
.tile.artist{text-align:center}
.tile-cover{position:relative;margin-bottom:10px}
.tile-cover .cover{box-shadow:0 8px 22px rgba(0,0,0,.4)}
.fab{width:42px;height:42px;border-radius:99px;background:var(--purple);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .16s,opacity .16s,background .16s;flex:0 0 42px}
.fab svg{width:15px;height:15px;fill:#fff}
.fab:hover{background:#ad63e8}
.tile-cover .fab{position:absolute;right:8px;bottom:8px;opacity:0;transform:translateY(8px)}
.tile:hover .tile-cover .fab,.tile:focus-within .tile-cover .fab{opacity:1;transform:none}
@media(hover:none){.tile-cover .fab{opacity:1;transform:none}.qpc .fab{opacity:1;transform:translateY(-50%)}}
.tile strong{display:block;font-family:var(--fd);font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.tile span{display:block;font-size:.79rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.playing strong{color:var(--cyan)}
.slot-open{color:var(--cyan)}
.pill{position:absolute;left:8px;top:8px;font-family:var(--fd);font-size:.66rem;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px}
.pill-open{background:rgba(0,245,212,.92);color:#08201c}
.pill-tipo{background:rgba(18,14,22,.85);color:var(--text);backdrop-filter:blur(4px);border:1px solid var(--line)}

/* ============ LISTA DE FAIXAS ============ */
.tracklist{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;max-width:840px}
.trow{display:flex;align-items:center;gap:13px;padding:9px 12px;width:100%;text-align:left;transition:background .16s;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--surface-2)}
.trow .num{width:24px;text-align:right;color:var(--muted);font-size:.85rem;font-family:var(--fd);flex:0 0 24px}
.trow .thumb{width:44px;height:44px;border-radius:5px;overflow:hidden;flex:0 0 44px;background:var(--surface-2)}
.trow .thumb img,.trow .thumb svg{width:100%;height:100%;object-fit:cover;display:block;border-radius:5px}
.trow .tinfo{min-width:0;flex:1}
.trow strong{display:block;font-family:var(--fd);font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tinfo span{display:block;font-size:.79rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.playing strong{color:var(--cyan)}
.trow .src{font-size:.71rem;color:var(--muted);font-family:var(--fd);white-space:nowrap}
@media(max-width:560px){.trow .src{display:none}}

/* ============ AVATAR ============ */
.av{border-radius:99px;display:grid;place-items:center;flex:0 0 auto;font-family:var(--fd);font-weight:700;color:#fff;width:44px;height:44px;font-size:.9rem;position:relative}
.av.sm{width:34px;height:34px;font-size:.74rem}
.av.md{width:56px;height:56px;font-size:1.05rem}
.av.lg{width:86px;height:86px;font-size:1.6rem}
.av .on-dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:99px;background:var(--cyan);border:2.5px solid var(--bg)}

/* ============ CARDS DE OBRA ============ */
.obra{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px;transition:border-color .18s;text-align:left;width:100%;display:block}
.obra:hover{border-color:var(--purple)}
.obra-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.obra-top .who{font-size:.82rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-family:var(--fd);font-size:.7rem;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;margin-left:auto}
.badge.poema{color:var(--purple);border-color:rgba(157,78,221,.45);background:rgba(157,78,221,.1)}
.badge.microconto{color:#ffd166;border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.08)}
.badge.arte{color:var(--cyan);border-color:rgba(0,245,212,.4);background:rgba(0,245,212,.08)}
.badge.musica{color:#8ecaff;border-color:rgba(142,202,255,.4);background:rgba(142,202,255,.08)}
.obra h3{font-size:1.06rem;margin-bottom:9px}
.obra .texto{font-size:.97rem;line-height:1.75;color:var(--text);white-space:pre-line;border-left:2px solid var(--purple);padding-left:13px}
.obra .texto.mc{border-left-color:#ffd166}
.grid-obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}

/* ============ FEED ============ */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;max-width:730px}
.post-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.post-who strong{display:block;font-family:var(--fd);font-size:.97rem}
.post-who span{font-size:.81rem;color:var(--muted)}
.post-title{font-family:var(--fd);font-size:1.1rem;font-weight:600;margin-bottom:8px}
.post-verse{border-left:2px solid var(--purple);padding:2px 0 2px 14px;margin:12px 0 14px;font-size:1rem;line-height:1.7;white-space:pre-line}
.post-audio{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0 6px}
.post-audio .meta{font-size:.82rem;color:var(--muted);white-space:nowrap}
.post-audio .wave{flex:1;min-width:0;overflow:hidden}
.audio-info{font-size:.83rem;color:var(--muted);margin:0 0 13px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.tag-chip{font-size:.78rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.callout{display:flex;align-items:center;gap:9px;font-size:.87rem;background:rgba(0,245,212,.06);border:1px dashed rgba(0,245,212,.35);color:var(--cyan);padding:9px 13px;border-radius:var(--radius-sm);margin-bottom:13px}
.callout b{font-weight:600;color:var(--text)}
.post-acts{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.act{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;color:var(--muted);font-size:.86rem;transition:color .16s,background .16s}
.act svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act:hover{background:var(--surface-2);color:var(--text)}
.act.on{color:var(--cyan)}
.act.on svg{fill:var(--cyan);stroke:var(--cyan)}
.act-collab{margin-left:auto;color:var(--purple);border:1px solid rgba(157,78,221,.4);font-family:var(--fd);font-weight:600}
.act-collab:hover{background:var(--purple);color:#fff}
.coments{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:11px}
.cmt{display:flex;gap:10px}
.cmt .body{background:var(--surface-2);border-radius:12px;padding:9px 13px;font-size:.89rem;min-width:0}
.cmt .body b{font-family:var(--fd);font-size:.84rem;display:block;color:var(--text)}
.cmt-form{display:flex;gap:9px;align-items:center;margin-top:11px}
.cmt-form input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:9px 15px;outline:none;font-size:.9rem}
.cmt-form input:focus{border-color:var(--purple)}

.wave{display:flex;align-items:center;gap:2px;height:26px}
.wave i{display:block;flex:1 1 auto;min-width:2px;max-width:4px;border-radius:99px;background:var(--purple);height:30%;animation:bounce 1s ease-in-out infinite alternate}
.wave.static i{animation-play-state:paused}
@keyframes bounce{to{height:100%}}
@media(prefers-reduced-motion:reduce){.wave i{animation:none;height:58%}}

/* ============ CHIPS / GRIDS ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.88rem;transition:all .16s}
.chip:hover{color:var(--text);border-color:var(--purple)}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.chip.big{padding:13px 20px;font-size:.98rem;font-family:var(--fd);display:inline-flex;align-items:center;gap:9px}
.chip.big.on{box-shadow:0 0 22px rgba(157,78,221,.4)}
.grid-art{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.art-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;text-align:center;transition:border-color .18s,background .18s}
.art-card:hover{border-color:var(--purple);background:var(--surface-2)}
.art-card .av,.art-card .cover{margin:0 auto 12px}
.art-card .cover{width:84px;height:84px;aspect-ratio:auto}
.art-card strong{display:block;font-family:var(--fd);font-size:1rem}
.art-card .role{font-size:.84rem;color:var(--purple);margin:3px 0 2px}
.art-card .city{font-size:.79rem;color:var(--muted);margin-bottom:13px}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:40px 24px;text-align:center;color:var(--muted);max-width:730px}
.empty strong{display:block;color:var(--text);font-family:var(--fd);font-size:1.03rem;margin-bottom:6px}

/* ============ COLABS ============ */
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px;max-width:840px}
.proj-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:17px;flex-wrap:wrap}
.proj-head h3{font-size:1.13rem}
.proj-head p{font-size:.84rem;color:var(--muted)}
.prog{margin-left:auto;text-align:right;min-width:120px}
.prog b{font-family:var(--fd);font-size:.84rem;color:var(--cyan)}
.prog-bar{height:5px;border-radius:99px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:99px;transition:width .5s}
.slots{display:flex;flex-direction:column;gap:9px}
.slot{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid transparent}
.slot.open{background:transparent;border:1px dashed var(--line)}
.slot-role{font-family:var(--fd);font-size:.87rem;min-width:88px;color:var(--muted)}
.slot strong{font-size:.91rem}
.slot .ok{margin-left:auto;color:var(--purple);font-size:.79rem;font-family:var(--fd)}
.slot .btn{margin-left:auto}
.slot-open-lbl{color:var(--muted);font-size:.89rem;font-style:italic}

/* ============ O BURACO ============ */
.buraco{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);margin-bottom:26px;
  background:linear-gradient(180deg,#1A1523 0%,#140F1C 40%,#0A070E 100%)}
.buraco-in{padding:44px 28px;text-align:center;position:relative}
.buraco h1{font-size:clamp(1.9rem,5vw,3rem);margin-bottom:12px}
.buraco .desc{color:var(--muted);max-width:32em;margin:0 auto 26px;font-size:.98rem}
.descida{display:flex;flex-direction:column;align-items:center;gap:7px;margin:26px 0 8px;color:var(--muted);font-family:var(--fd);font-size:.82rem;letter-spacing:.1em}
.descida i{display:block;width:1px;height:26px;background:linear-gradient(180deg,var(--purple),transparent)}
.fundo{background:var(--surface);border:1px solid rgba(157,78,221,.35);border-radius:18px;padding:26px 22px;max-width:430px;margin:0 auto;box-shadow:0 0 60px rgba(157,78,221,.18)}
.fundo .av{margin:0 auto 14px}
.fundo h3{font-size:1.35rem;margin-bottom:4px}
.fundo .loc{color:var(--muted);font-size:.87rem;margin-bottom:14px}
.fundo .ouv{font-family:var(--fd);color:var(--cyan);font-size:.92rem;margin-bottom:18px}
.fundo .btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ============ ASCENSÃO ============ */
.tabela{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;max-width:840px;font-size:.92rem}
.tabela th{background:var(--surface-2);text-align:left;font-family:var(--fd);font-size:.8rem;color:var(--muted);padding:11px 14px;font-weight:600;letter-spacing:.04em}
.tabela td{padding:11px 14px;border-top:1px solid var(--line)}
.tabela tr:hover td{background:var(--surface)}
.tabela .nome{display:flex;align-items:center;gap:10px}
.tabela .up{color:var(--cyan);font-family:var(--fd);font-weight:600;white-space:nowrap}
.tabela .barra{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:70px}
.tabela .barra i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}
@media(max-width:620px){.tabela .hide-xs2{display:none}}

/* ============ MAPA ============ */
.mapa-wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
@media(max-width:860px){.mapa-wrap{grid-template-columns:1fr}}
.mapa{background:linear-gradient(160deg,#171122,#0D0A12);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.mapa svg{width:100%;height:auto;display:block;overflow:visible}
.cidade-dot{cursor:pointer;transition:opacity .2s}
.cidade-dot:hover .halo{opacity:.55}
.cidade-dot .halo{opacity:.18;transition:opacity .2s}
.cidade-dot.sel .halo{opacity:.7}
.cidade-dot text{font-family:var(--fd);font-size:2.6px;fill:var(--muted)}
.cidade-dot.sel text{fill:var(--text)}
.mapa-legend{font-size:.78rem;color:var(--muted);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.mapa-legend span{display:flex;align-items:center;gap:6px}
.mapa-legend i{width:9px;height:9px;border-radius:99px;display:block}

/* ============ EVENTOS ============ */
.ev{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;max-width:840px;align-items:center;flex-wrap:wrap}
.ev-data{width:66px;flex:0 0 66px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:var(--surface-2)}
.ev-data b{display:block;font-family:var(--fd);font-size:1.5rem;line-height:1;color:var(--purple)}
.ev-data span{font-size:.72rem;color:var(--muted);letter-spacing:.08em;font-family:var(--fd)}
.ev-txt{flex:1;min-width:180px}
.ev-txt h3{font-size:1.06rem;margin-bottom:3px}
.ev-txt p{font-size:.85rem;color:var(--muted)}

/* ============ PERFIL / BIBLIOTECA ============ */
.prof-head{display:flex;gap:22px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.prof-head h2{font-size:1.75rem}
.prof-head .role{color:var(--purple);font-family:var(--fd);font-size:.94rem}
.prof-head .city{color:var(--muted);font-size:.87rem}
.prof-bio{color:var(--muted);max-width:46em}
.stats{display:flex;gap:26px;margin:22px 0;padding:17px 0;border-block:1px solid var(--line);flex-wrap:wrap;max-width:840px}
.stat b{display:block;font-family:var(--fd);font-size:1.32rem}
.stat span{font-size:.81rem;color:var(--muted)}
.lvl-card{background:linear-gradient(120deg,rgba(157,78,221,.18),rgba(0,245,212,.06));border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:24px;max-width:840px}
.lvl-card .top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.lvl-card .em{font-size:2rem}
.lvl-card h3{font-size:1.25rem}
.lvl-card .nvl{font-family:var(--fd);color:var(--cyan);font-size:.84rem}
.lvl-card p{font-size:.88rem;color:var(--muted);margin-top:10px}
.pl-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;max-width:840px;text-align:left;width:100%;transition:border-color .18s}
.pl-card:hover{border-color:var(--purple)}
.pl-mini{width:54px;height:54px;flex:0 0 54px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:var(--surface-2)}
.pl-mini>*{width:100%;height:100%;object-fit:cover}
.pl-card .info{min-width:0;flex:1}
.pl-card strong{display:block;font-family:var(--fd);font-size:1rem}
.pl-card span{font-size:.82rem;color:var(--muted)}
.colab-pill{font-family:var(--fd);font-size:.7rem;color:var(--cyan);border:1px solid rgba(0,245,212,.4);background:rgba(0,245,212,.08);padding:3px 9px;border-radius:99px;white-space:nowrap}

/* ============ VIBE / IA ============ */
.vibe-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:26px}
.ia-box{background:linear-gradient(130deg,rgba(157,78,221,.16),rgba(0,245,212,.05));border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:26px}
.ia-row{display:flex;gap:10px;flex-wrap:wrap}
.ia-row input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:12px 18px;outline:none}
.ia-row input:focus{border-color:var(--purple)}
.ia-sug{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.ia-sug button{font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 12px;transition:all .16s}
.ia-sug button:hover{color:var(--text);border-color:var(--purple)}
.ia-nota{font-size:.78rem;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.sessao{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;max-width:840px;margin-top:18px}

/* ============ PLAYER ============ */
.ap-player{grid-area:player;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px}
@media(max-width:900px){.ap-player{padding:8px 12px;gap:10px}}
.pl-info{display:flex;align-items:center;gap:12px;min-width:0;width:250px}
@media(max-width:900px){.pl-info{width:auto;flex:1}}
.pl-art{width:50px;height:50px;flex:0 0 50px;border-radius:6px;overflow:hidden;position:relative;background:var(--surface-2);cursor:pointer}
.pl-art img,.pl-art svg{width:100%;height:100%;object-fit:cover;display:block}
#ytHolder{position:absolute;inset:0;display:none;pointer-events:none}
#ytHolder.on{display:block}
#ytHolder iframe{position:absolute;top:50%;left:50%;width:300px;height:169px;border:0;transform:translate(-50%,-50%) scale(.296);transform-origin:center}
.pl-art.big{position:fixed;right:20px;bottom:96px;width:320px;height:180px;z-index:150;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);border:1px solid var(--line)}
.pl-art.big #ytHolder iframe{transform:translate(-50%,-50%) scale(1.067)}
@media(max-width:900px){.pl-art.big{right:12px;left:12px;width:auto;bottom:auto;top:66px;height:auto;aspect-ratio:16/9}.pl-art.big #ytHolder iframe{transform:translate(-50%,-50%) scale(1.2)}}
.pl-info strong{display:block;font-family:var(--fd);font-size:.89rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-info .sub{font-size:.77rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pl-mid{flex:1;display:flex;align-items:center;gap:9px;justify-content:center;min-width:0;flex-direction:column;padding:10px 0}
@media(max-width:900px){.pl-mid{flex:0 0 auto;flex-direction:row;padding:0}}
.pl-ctrls{display:flex;align-items:center;gap:14px}
.pl-track{width:100%;max-width:440px;min-width:0}
@media(max-width:900px){.pl-track{display:none}}
.pl-bar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;cursor:pointer}
.pl-bar i{display:block;height:100%;width:0;background:var(--purple);border-radius:99px}
.pl-times{display:flex;justify-content:space-between;font-size:.71rem;color:var(--muted);margin-top:4px}
.pl-right{width:250px;display:flex;justify-content:flex-end;align-items:center;gap:10px}
@media(max-width:900px){.pl-right{width:auto}}
.pl-right .wave{height:20px;width:66px}
@media(max-width:560px){.pl-right .wave{display:none}}
.icobtn{color:var(--muted);display:grid;place-items:center;padding:6px;border-radius:8px;transition:color .16s}
.icobtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icobtn:hover{color:var(--text)}
.icobtn.on{color:var(--cyan)}
.icobtn.on svg{fill:var(--cyan)}
.icobtn.sk svg{fill:currentColor;stroke:none;width:17px;height:17px}
#plMini.on svg{fill:none}
.ap-main,.ap-player,.ap-side{min-width:0}

/* ============ MODAL / TOAST / QR ============ */
.ov{position:fixed;inset:0;z-index:250;background:rgba(8,5,12,.8);backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;padding:26px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2);margin:auto}
.modal.wide{max-width:640px}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.modal h3{font-size:1.24rem;margin-bottom:6px}
.modal .m-sub{color:var(--muted);font-size:.89rem;margin-bottom:20px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.leitor{font-size:1.06rem;line-height:1.85;white-space:pre-line;border-left:2px solid var(--purple);padding-left:18px;margin:6px 0 18px}
.leitor.mc{border-left-color:#ffd166;font-size:1rem;line-height:1.8}
.toasts{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:440px}
.toast{background:var(--surface-3);border:1px solid var(--cyan);padding:12px 20px;border-radius:99px;font-size:.89rem;box-shadow:0 8px 30px rgba(0,0,0,.55);animation:toastIn .28s;display:flex;align-items:center;gap:10px}
.toast.xp{border-color:var(--purple)}
.toast svg{width:16px;height:16px;stroke:var(--cyan);fill:none;stroke-width:2.4;flex:0 0 16px}
.toast.xp svg{stroke:var(--purple)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}
#qrbox{background:#fff;padding:16px;border-radius:14px;display:inline-block;line-height:0}
#qrbox img,#qrbox canvas{display:block}
.qr-wrap{text-align:center}
.qr-url{font-family:var(--fd);color:var(--cyan);font-size:1rem;margin-top:16px;word-break:break-all}

/* ============ CONTAS ============ */
.auth-tabs{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:20px}
.auth-tabs button{flex:1;padding:9px 10px;border-radius:99px;font-family:var(--fd);font-weight:600;font-size:.9rem;color:var(--muted);transition:background .18s,color .18s}
.auth-tabs button.on{background:var(--purple);color:#fff}
.modo{display:inline-flex;align-items:center;gap:7px;font-family:var(--fd);font-size:.74rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-bottom:8px}
.modo i{width:7px;height:7px;border-radius:99px;background:var(--muted);display:block}
.modo.nuvem{color:var(--cyan);border-color:rgba(0,245,212,.4)}
.modo.nuvem i{background:var(--cyan)}
.auth-wait{text-align:center;color:var(--muted);padding:26px 0;font-size:.92rem}
.field .hint{font-size:.76rem;color:var(--muted);margin-top:6px}
#scout{position:fixed;left:-9999px;top:0;width:200px;height:120px;opacity:0;pointer-events:none}
.shelf-head p.more{display:block}
.lk{color:var(--cyan);font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.lk:hover{color:var(--text)}
.info-box{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;max-width:840px;margin-bottom:14px;color:var(--muted);font-size:.9rem}
.info-box strong{display:block;color:var(--text);font-family:var(--fd);font-size:1rem;margin-bottom:5px}
.info-box .btn{margin-top:12px}
</style>
</head>

   do projeto > Seus apps > Web). Com ele preenchido, contas, senhas e

const FIREBASE_CONFIG={
  apiKey:"AIzaSyAwLw89x1HBs0f10fFQuHqFiFiUVzRbXvM",

const NUVEM_CONFIGURADA=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId);
const SAL="underfy::v4::";

async function hash(txt){
  try{
    if(crypto&&crypto.subtle){
      const b=new TextEncoder().encode(SAL+txt);
      const d=await crypto.subtle.digest("SHA-256",b);
      return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let h=5381; const t=SAL+txt;
  for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0;
  return "fb"+(h>>>0).toString(16);
}
const chave=u=>String(u||"").trim().toLowerCase();
const kConta=u=>"underfy.conta."+chave(u);
const kDados=u=>"underfy.dados."+chave(u);
function validarUsuario(u){
  u=String(u||"").trim();
  if(u.length<3||u.length>20) return "O usuário precisa ter de 3 a 20 caracteres.";
  if(!/^[A-Za-z0-9._-]+$/.test(u)) return "Use só letras, números, ponto, hífen ou sublinhado.";
  return "";
}
function carregarScript(src){
  return new Promise((ok,er)=>{ const el=document.createElement("script"); el.src=src; el.onload=()=>ok(); el.onerror=()=>er(new Error("script")); document.head.appendChild(el); });
}
function erroAuth(e){
  const c=String((e&&e.code)||"");
  const M={
   "auth/email-already-in-use":"Esse nome de usuário já existe. Escolha outro ou entre com ele.",
   "local/existe":"Esse nome de usuário já existe. Escolha outro ou entre com ele.",
   "auth/invalid-credential":"Usuário ou senha incorretos.",
   "auth/invalid-login-credentials":"Usuário ou senha incorretos.",
   "auth/wrong-password":"Usuário ou senha incorretos.",
   "auth/user-not-found":"Usuário ou senha incorretos.",
   "local/credencial":"Usuário ou senha incorretos.",
   "auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.",
   "auth/too-many-requests":"Muitas tentativas seguidas. Espere um minuto e tente de novo.",
   "auth/network-request-failed":"Sem conexão com o banco de dados. Confira a internet.",
   "auth/operation-not-allowed":"O login por e-mail/senha ainda não foi ativado no Firebase (Authentication > Método de login).",
   "auth/unauthorized-domain":"Este endereço não está nos domínios autorizados do Firebase (Authentication > Configurações).",
   "auth/invalid-api-key":"A chave do Firebase colada no arquivo está incorreta.",
   "auth/requires-recent-login":"Saia e entre de novo antes de trocar a senha.",
   "permission-denied":"O banco recusou a gravação. Confira as regras do Firestore."
  };
  return M[c]||"Não deu certo agora"+(c?" ("+c+")":"")+". Tente de novo.";
}

const DB={
  modo:"local", falhou:false, auth:null, fs:null, uid:null,
  async iniciar(){
    if(!NUVEM_CONFIGURADA) return this.modo;
    try{
      const base="https://www.gstatic.com/firebasejs/"+FB_VER+"/";
      await carregarScript(base+"firebase-app-compat.js");
      await Promise.all([carregarScript(base+"firebase-auth-compat.js"),carregarScript(base+"firebase-firestore-compat.js")]);
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth=firebase.auth();
      this.fs=firebase.firestore();
      try{ this.fs.settings({ignoreUndefinedProperties:true}); }catch(e){}
      this.modo="nuvem";
    }catch(e){ this.modo="local"; this.falhou=true; }
    return this.modo;
  },
  _nome(u){ return u.displayName||String(u.email||"").split("@")[0]; },
  _doc(){ return this.fs.collection("usuarios").doc(this.uid); },
  _agora(){ return firebase.firestore.FieldValue.serverTimestamp(); },
  sessao(){
    if(this.modo==="nuvem") return new Promise(res=>{
      let feito=false, off=null;
      off=this.auth.onAuthStateChanged(u=>{
        if(feito) return; feito=true; setTimeout(()=>{ try{ off&&off(); }catch(e){} },0);
        if(!u){ res(null); return; } this.uid=u.uid; res({nome:this._nome(u)});
      });
    });
    const k=store.get("underfy.sessao"), c=k?store.get(kConta(k)):null;
    return Promise.resolve(c?{nome:c.nome}:null);
  },
  async registrar(nome,senha){
    nome=String(nome).trim();
    if(this.modo==="nuvem"){
      const cred=await this.auth.createUserWithEmailAndPassword(chave(nome)+DOMINIO_CONTA,senha);
      this.uid=cred.user.uid;
      try{ await cred.user.updateProfile({displayName:nome}); }catch(e){}
      try{ await this._doc().set({nome:nome,criadoEm:this._agora(),dados:dadosPadrao()}); }catch(e){}
      return {nome:nome};
    }
    if(store.get(kConta(nome))) throw {code:"local/existe"};
    store.set(kConta(nome),{nome:nome,hash:await hash(senha),criadoEm:Date.now()});
    store.set("underfy.sessao",chave(nome));
    return {nome:nome};
  },
  async entrar(nome,senha){
    if(this.modo==="nuvem"){
      const cred=await this.auth.signInWithEmailAndPassword(chave(nome)+DOMINIO_CONTA,senha);
      this.uid=cred.user.uid;
      return {nome:this._nome(cred.user)};
    }
    const c=store.get(kConta(nome));
    if(!c||c.hash!==await hash(senha)) throw {code:"local/credencial"};
    store.set("underfy.sessao",chave(nome));
    return {nome:c.nome};
  },
  async sair(){
    if(this.modo==="nuvem") await this.auth.signOut();
    else store.del("underfy.sessao");
  },
  async trocarSenha(atual,nova){
    if(this.modo==="nuvem"){
      const u=this.auth.currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,atual));
      await u.updatePassword(nova);
      return;
    }
    const c=store.get(kConta(USER));
    if(!c||c.hash!==await hash(atual)) throw {code:"local/credencial"};
    c.hash=await hash(nova); store.set(kConta(USER),c);
  },
  async lerDados(){
    if(this.modo==="nuvem"&&this.uid){
      try{ const d=await this._doc().get(); if(d.exists&&d.data().dados) return d.data().dados; }catch(e){}
    }
    return store.get(kDados(USER));
  },
  gravarDados(dados){
    store.set(kDados(USER),dados);
    if(this.modo==="nuvem"&&this.uid){
      return this._doc().set({nome:USER,dados:JSON.parse(JSON.stringify(dados)),atualizadoEm:this._agora()},{mergeFields:["nome","dados","atualizadoEm"]})
        .then(()=>{ this.erroGravar=false; })
        .catch(e=>{ if(!this.erroGravar){ this.erroGravar=true; toast(erroAuth(e)); } });
    }
    return Promise.resolve();
  },
  async lerCatalogo(){
    if(this.modo!=="nuvem") return null;
    try{ const d=await this.fs.collection("publico").doc("catalogo").get(); return d.exists?d.data():null; }catch(e){ return null; }
  },
  gravarCatalogo(obj){
    if(this.modo==="nuvem"&&this.uid) return this.fs.collection("publico").doc("catalogo").set(obj).catch(()=>{});
    return Promise.resolve();
  },
  async listarPosts(){
    if(this.modo==="nuvem"){
      try{ const q=await this.fs.collection("posts").orderBy("ts","desc").limit(40).get(); return q.docs.map(d=>Object.assign({},d.data(),{id:d.id})); }catch(e){ return []; }
    }
    return store.get("underfy.posts")||[];
  },
  async criarPost(p){
    if(this.modo==="nuvem"&&this.uid){
      const r=await this.fs.collection("posts").add(Object.assign({},p,{uid:this.uid}));
      return r.id;
    }
    const l=store.get("underfy.posts")||[];
    const id="l"+Date.now();
    l.unshift(Object.assign({},p,{id:id}));
    store.set("underfy.posts",l.slice(0,60));
    return id;
  }
};

function limpa(s){
  return String(s).replace(/\((?:official|oficial|clipe|videoclipe|prod|visualizer|lyric|audio|áudio)[^)]*\)/ig,"").replace(/\[[^\]]*\]/g,"")
   .replace(/\b(official\s*(music\s*)?video|videoclipe\s*oficial|clipe\s*oficial|official\s*audio|áudio\s*oficial|lyric\s*video|visualizer)\b/ig,"")
   .replace(/\|.*$/,"").replace(/\s{2,}/g," ").trim().replace(/[-–—|,]\s*$/,"").trim();
}
function interpretar(d){
  let ar=String(d.author_name||"").replace(/\s*-\s*Topic$/i,"").replace(/VEVO$/i,"").trim();
  let ti=String(d.title||"");
  const p=ti.split(/\s+[-–—]\s+/);
  if(p.length>=2&&p[0].trim().length<=48){ ar=limpa(p[0])||ar; ti=limpa(p.slice(1).join(" - ")); }
  else ti=limpa(ti);
  return {t:ti||String(d.title||""),a:ar};
}
async function metaDe(vid){
  const u="https://www.youtube.com/oembed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+vid)+"&format=json";
  const res=await fetch(u); if(!res.ok) throw new Error("oembed "+res.status);
  return interpretar(await res.json());
}
async function emLotes(lista,n,fn){
  const out=new Array(lista.length); let i=0;
  const w=async()=>{ while(i<lista.length){ const k=i++; try{ out[k]=await fn(lista[k]); }catch(e){ out[k]=null; } } };
  await Promise.all(Array.from({length:Math.min(n,lista.length)},w));
  return out;
}

  if(n){ montarCatalogo(); if(USER) render(); }
  return n;
}
/* lê os IDs da playlist com um player invisível do próprio YouTube */
function idsDaPlaylist(LISTA){
  return new Promise(res=>{
    if(!window.YT||!YT.Player){ res(null); return; }
    let fim=false, sc=null, visto=0; const t0=Date.now();
    const acabar=v=>{
      if(fim) return; fim=true; clearInterval(iv);
      try{ sc&&sc.destroy&&sc.destroy(); }catch(e){}
      const h=document.getElementById("scout"); if(h) h.innerHTML='<div id="scoutFrame"></div>';
      res(v);
    };
    const olhar=()=>{
      let l=null; try{ l=sc&&sc.getPlaylist&&sc.getPlaylist(); }catch(e){}
      if(l&&l.length){ if(!visto) visto=Date.now(); else if(Date.now()-visto>800){ acabar(l.slice()); return; } }
      if(Date.now()-t0>14000) acabar(l&&l.length?l.slice():null);
    };
    const iv=setInterval(olhar,400);
    try{
      sc=new YT.Player("scoutFrame",{height:"120",width:"200",
        playerVars:{listType:"playlist",list:LISTA,playsinline:1,controls:0},
        events:{onReady:()=>{ try{ sc.cuePlaylist({listType:"playlist",list:LISTA}); }catch(e){} },onError:()=>{}}});
    }catch(e){ acabar(null); }
  });
}
let sincronizando=false;
async function sincronizarPlaylist(manual){
  if(sincronizando) return 0; sincronizando=true;
  try{
    /* lê as playlists uma de cada vez; se uma falhar, mantém as faixas que já tinha dela */
    const ids=[], origem=new Map(); let falhas=0;
    for(let k=0;k<PLAYLISTS.length;k++){
      let l=await idsDaPlaylist(PLAYLISTS[k].id);
      if(!l||!l.length){ falhas++; l=REAL.filter(r=>(r.pl||0)===k&&r.ok).map(r=>r.vid); }
      l.forEach(v=>{ if(!origem.has(v)){ origem.set(v,k); ids.push(v); } });
    }
    if(!ids.length||falhas===PLAYLISTS.length){ if(manual) toast("Não consegui ler as playlists do YouTube agora. Tente de novo em instantes."); return 0; }
    const conhecidas=new Map(REAL.filter(r=>r.ok).map(r=>[r.vid,r]));
    const metas=await emLotes(ids,6,async vid=>Object.assign({},conhecidas.get(vid)||Object.assign({vid:vid,ok:true},await metaDe(vid)),{pl:origem.get(vid)}));
    const faixas=metas.filter(Boolean);
    if(faixas.length<Math.min(3,ids.length)){ if(manual) toast("O YouTube não devolveu os dados das faixas agora."); return 0; }
    const mudou=faixas.map(f=>f.vid+":"+f.pl).join()!==REAL.map(f=>f.vid+":"+(f.pl||0)).join()||REAL.some(r=>!r.ok);
    if(mudou){
      aplicarCatalogo(faixas,"playlist");
      DB.gravarCatalogo({faixas:faixas.map(f=>({vid:f.vid,t:f.t,a:f.a,pl:f.pl,ok:true})),playlist:PLAYLIST_ID,em:Date.now()});
    } else { FONTE_CAT="playlist"; if(USER&&view==="voce") render(); }
    if(manual) toast(faixas.length+" faixas no catálogo"+(ids.length>faixas.length?" ("+(ids.length-faixas.length)+" não podem tocar fora do YouTube)":"")+".");
    return faixas.length;
  }finally{ sincronizando=false; }
}
function artistasReais(){
  const m=new Map();
  idsReais.forEach(id=>{const t=T(id); if(!m.has(t.a))m.set(t.a,[]); m.get(t.a).push(id);});
  return [...m.entries()].map(([nome,ids])=>({nome,ids}));
}

  [...PLAYLISTS.keys()].reverse().forEach(k=>{

     '<div class="tile-cover">'+svgCover(a.g,"round")+'</div><strong>'+esc(a.nome)+'</strong>'+
     '<span class="'+(a.online?"slot-open":"")+'">'+(a.online?"online · ":"")+esc(a.cidade)+'</span></button>').join(""));

function linhaItem(it,i){

function tabelaAscensao(){
  const lista=[...artistas].sort((a,b)=>b.cres-a.cres).slice(0,8);

  return '<table class="tabela"><thead><tr><th>Artista</th><th class="hide-xs2">Cidade</th><th>Plays</th><th>Crescimento</th></tr></thead><tbody>'+
   lista.map(a=>'<tr><td><span class="nome">'+avatar(a,"sm")+'<button data-a="artista" data-v="'+a.id+'"><strong>'+esc(a.nome)+'</strong></button></span></td>'+

    '<td><span class="up">+'+a.cres+'%</span><div class="barra"><i style="width:'+Math.round(a.cres/max*100)+'%"></i></div></td></tr>').join("")+

VIEWS.buscar=()=>{
  let h='<h1 class="ap-h">Buscar</h1><p class="ap-sub">Música, poema, microconto, arte, artista ou cidade.</p>';
  if(!busca) return h+'<div class="empty"><strong>Digite alguma coisa lá em cima</strong>Tente “Recife”, “poema”, “lo-fi” ou o nome de um artista.</div>';
  const q=busca;
  const fx=Object.keys(CAT).filter(id=>(T(id).t+" "+T(id).a+" "+(T(id).sub||"")).toLowerCase().includes(q));
  const ob=obras.filter(o=>o.tipo!=="musica"&&((o.t+" "+A(o.au).nome+" "+(o.texto||o.desc||"")+" "+o.gen.join(" ")).toLowerCase().includes(q)));
  const ar=artistas.filter(a=>(a.nome+" "+a.handle+" "+a.papel+" "+a.cidade+" "+a.uf+" "+a.gen.join(" ")).toLowerCase().includes(q));
  const yt=artistasReais().filter(x=>x.nome.toLowerCase().includes(q));
  if(fx.length) h+='<h3 class="sec-h">Faixas</h3><div class="tracklist">'+fx.map((id,i)=>linhaItem({k:"faixa",id},i+1)).join("")+'</div>';
  if(ob.length) h+='<h3 class="sec-h">Textos e artes</h3><div class="grid-obras">'+ob.map(cardObra).join("")+'</div>';
  if(yt.length) h+='<h3 class="sec-h">Artistas do catálogo</h3><div class="grid-art">'+yt.map(x=>
     '<div class="art-card"><img class="cover round" loading="lazy" alt="" src="'+thumb(T(x.ids[0]).vid)+'" data-vid="'+T(x.ids[0]).vid+'" data-step="0">'+
     '<strong>'+esc(x.nome)+'</strong><div class="role">Trap BR</div><div class="city">'+x.ids.length+' no Underfy</div>'+
     '<button class="btn btn-ghost btn-sm btn-block" data-a="tocar" data-v="'+x.ids[0]+'">Ouvir</button></div>').join("")+'</div>';
  if(ar.length) h+='<h3 class="sec-h">Artistas da plataforma</h3><div class="grid-art">'+ar.map(cardArtista).join("")+'</div>';
  if(!fx.length&&!ob.length&&!ar.length&&!yt.length)
    h+='<div class="empty"><strong>Nada encontrado</strong>Tente outro nome, estilo ou cidade.</div>';
  return h;
};
function cardObra(o){

  } else {
    h+='<div class="empty" style="max-width:none"><strong>Toque numa cidade</strong>O mapa mostra quantos artistas cada cidade tem e quem colabora com quem.</div>';

function plCard(pl){
  const capas=pl.faixas.slice(0,4).map(id=>{const t=T(id);return t?capaFaixa(t):(O(id)?capaObra(O(id)):svgCover(0));});
  while(capas.length<4) capas.push(svgCover(3));
  return '<button class="pl-card" data-a="abrirPl" data-v="'+pl.id+'">'+
   '<span class="pl-mini">'+capas.join("")+'</span>'+
   '<span class="info"><strong>'+esc(pl.nome)+'</strong><span>'+pl.faixas.length+' itens'+(pl.dono?" · criada por "+esc(pl.dono):"")+'</span></span>'+
   (pl.aberta?'<span class="colab-pill">👥 '+pl.colab+' colaboradores</span>':'')+'</button>';
}

let historico=[];
const ACOES={
  ir:v=>{ if(view!=="artista") historico=[]; ir(v); },
  voltar:()=>{ const p=historico.pop(); ir(p||"inicio"); },
  artista:v=>{ historico.push(view); descobrir(v); ir("artista",v); },
  cidade:v=>{ cidadeSel=(cidadeSel===v?null:v); render(); },
  gen:v=>{ filtroGen.includes(v)?filtroGen=filtroGen.filter(x=>x!==v):filtroGen.push(v); render(); },
  limparGen:()=>{ filtroGen=[]; sessao=null; render(); },
  montar:()=>{
    const fx=Object.keys(CAT).filter(id=>{const o=O(id); return o?o.gen.some(g=>filtroGen.includes(g)):filtroGen.includes("trap")||filtroGen.includes("rap");});
    const ob=obras.filter(o=>o.tipo!=="musica"&&o.gen.some(g=>filtroGen.includes(g)));
    const mix=[];
    const emb=a=>a.slice().sort(()=>Math.random()-.5);
    const f=emb(fx),t=emb(ob);
    for(let i=0;i<8;i++){ if(i%3===2&&t.length) mix.push({k:"obra",id:t.pop().id}); else if(f.length) mix.push({k:"faixa",id:f.pop()}); }
    sessao=mix.filter(Boolean);
    if(!sessao.length){ toast("Nenhuma obra com essas vibes ainda. Tente outra combinação."); return; }
    xp(5,"sessão montada"); render();
    toast("Sua sessão tem "+sessao.length+" itens.");
  },
  tocarSessao:()=>{ const f=sessao.find(x=>x.k==="faixa"); if(f) tocar(f.id); else toast("Essa sessão só tem texto e arte. Abra o primeiro item."); },
  salvarSessao:()=>{
    DADOS.playlists.unshift({id:"pl"+Date.now(),nome:"Sessão "+new Date().toLocaleDateString("pt-BR"),faixas:sessao.map(x=>x.id)});
    salvar(); xp(5,"playlist criada"); toast("Playlist salva na sua biblioteca."); ir("biblioteca");
  },
  iaSug:v=>{ const i=document.getElementById("iaInput"); if(i){i.value=v;} ACOES.ia(); },
  ia:()=>{
    const q=(document.getElementById("iaInput")||{}).value||"";
    const s=q.toLowerCase();
    const mapa=[
     {kw:["triste","chorar","mal","deprê","sozinho","solidão","melancol"],gen:["dark","lofi","emo","poesia"]},
     {kw:["raiva","bravo","puto","revolta","ódio"],gen:["rap","rock","trap"]},
     {kw:["madrugada","noite","insônia","3 da manhã","dormir"],gen:["lofi","dark","poesia"]},
     {kw:["focar","estudar","trabalhar","concentr"],gen:["lofi","experimental"]},
     {kw:["apaixon","amor","paixão","crush"],gen:["emo","poesia","lofi"]},
     {kw:["saudade","casa","interior","cidade pequena"],gen:["poesia","experimental","rap"]},
     {kw:["festa","animado","energia","treino","correr"],gen:["trap","rap","rock"]},
     {kw:["estranho","diferente","experiment","doido"],gen:["experimental","dark"]}
    ];
    let gens=[];
    mapa.forEach(m=>{ if(m.kw.some(k=>s.includes(k))) gens=gens.concat(m.gen); });
    GENEROS.forEach(g=>{ if(s.includes(g.id)||s.includes(g.n.toLowerCase())) gens.push(g.id); });
    if(!gens.length) gens=["dark","lofi","poesia"];
    gens=[...new Set(gens)];
    const peq=s.includes("pequen")||s.includes("desconhec")||s.includes("ninguém");
    let arts=artistas.filter(a=>a.gen.some(g=>gens.includes(g)));
    if(peq) arts=arts.filter(a=>a.ouv<2500);
    const fx=obras.filter(o=>o.tipo==="musica"&&o.gen.some(g=>gens.includes(g))).map(o=>({k:"faixa",id:o.id}));
    const tx=obras.filter(o=>o.tipo!=="musica"&&o.gen.some(g=>gens.includes(g))).map(o=>({k:"obra",id:o.id}));
    const extra=peq?[]:idsReais.slice(0,3).map(id=>({k:"faixa",id}));
    iaRes={q:q,itens:fx.slice(0,5).concat(extra).concat(tx.slice(0,3)),arts:arts.slice(0,4)};
    if(!iaRes.itens.length){ toast("Não achei nada com essa vibe ainda."); return; }
    xp(3,"descoberta por vibe"); render();
    main().scrollTop=main().scrollHeight*.45;
  },
  tocar:v=>{ aleatorio=false; tocar(v); },
  embaralhar:()=>{ aleatorio=true; const l=view==="catalogo"?listaAtual():idsReais; tocar(l[Math.floor(Math.random()*l.length)]); toast("Modo aleatório ligado."); },
  verLista:v=>{ filtroLista=(v===""||v===undefined)?null:+v; ir("catalogo"); },
  sincronizar:()=>{ toast("Lendo as playlists no YouTube…"); sincronizarPlaylist(true); },
  instalar:()=>instalarApp(),
  mini:()=>abrirMini(),
  ouvirArtista:v=>{
    const m=obras.find(o=>o.tipo==="musica"&&o.au===v);
    descobrir(v);
    const a=A(v);
    if(a&&a.ouv<1500) xp(15,"descoberta n'O Buraco");
    if(m) tocar(m.id); else toast(a.nome+" ainda não subiu faixa. Veja os textos no perfil.");
  },
  abrir:v=>{
    const o=O(v); if(!o) return;
    descobrir(o.au);
    const a=A(o.au),salvo=DADOS.salvos.includes(o.id);
    modal(o.t, a.nome+" · "+a.cidade+", "+a.uf+" · "+o.tipo,
     (o.texto?'<p class="leitor'+(o.tipo==="microconto"?" mc":"")+'">'+esc(o.texto)+'</p>':
      '<div style="max-width:260px;margin:0 auto 18px">'+capaObra(o)+'</div><p style="color:var(--muted);text-align:center">'+esc(o.desc)+'</p>')+
     (o.vaga?'<div class="callout" style="margin-top:16px"><span>◇</span><span>Procura: <b>'+esc(o.vaga)+'</b></span></div>':''),
     salvo?"Remover dos salvos":"Salvar na biblioteca",
     ()=>{ ACOES.salvarObra(o.id); }, "wide");
  },
  salvarObra:v=>{
    const i=DADOS.salvos.indexOf(v);
    if(i<0){ DADOS.salvos.push(v); xp(2,"obra salva"); toast("Salvo na sua biblioteca."); }
    else { DADOS.salvos.splice(i,1); toast("Removido dos salvos."); }
    salvar(); render();
  },
  seguir:v=>{
    const i=DADOS.seguindo.indexOf(v);
    if(i<0){ DADOS.seguindo.push(v); descobrir(v); xp(5,"novo artista seguido"); toast("Seguindo "+A(v).nome+"."); }
    else { DADOS.seguindo.splice(i,1); toast("Deixou de seguir "+A(v).nome+"."); }
    salvar(); render();
  },
  curtirPost:v=>{
    const k="post"+v,i=DADOS.curtidas.indexOf(k);
    if(i<0){ DADOS.curtidas.push(k); xp(2,"curtida"); } else DADOS.curtidas.splice(i,1);
    salvar(); render();
  },
  comentar:v=>{
    const inp=document.getElementById("cmt"+v);
    const t=(inp&&inp.value||"").trim();
    if(!t){ toast("Escreva alguma coisa antes de enviar."); return; }
    DADOS.coments[v]=(DADOS.coments[v]||[]).concat([{t:t}]);
    salvar(); xp(2,"comentário"); render();
  },
  focarCmt:v=>{ const i=document.getElementById("cmt"+v); if(i) i.focus(); },
  compartilhar:v=>{
    const p=achaPost(v),url=location.href;
    if(navigator.share){ navigator.share({title:"Underfy",text:nomePost(p)+" no Underfy",url:url}).catch(()=>{}); }
    else copiar(url,"Link do Underfy copiado.");
  },
  compartilharArt:v=>{
    const a=A(v);
    if(navigator.share) navigator.share({title:a.nome+" no Underfy",url:location.href}).catch(()=>{});
    else copiar(location.href,"Link copiado. Cole onde quiser.");
  },
  colabPost:v=>{

function baseModal(html,cls){
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML='<div class="modal '+(cls||"")+'" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  addEventListener("keydown",function k(e){ if(e.key==="Escape"){close();removeEventListener("keydown",k);} });
  return {ov,close};
}
function modal(titulo,sub,corpo,cta,onOk,cls){
  const {ov,close}=baseModal('<h3></h3><p class="m-sub"></p><div class="mbody"></div>'+
   '<div class="modal-acts"><button class="btn btn-ghost btn-sm" data-x>Fechar</button>'+
   (cta?'<button class="btn btn-primary btn-sm" data-ok></button>':'')+'</div>',cls);
  ov.querySelector("h3").textContent=titulo;
  ov.querySelector(".m-sub").textContent=sub;
  ov.querySelector(".mbody").innerHTML=corpo;
  ov.querySelector("[data-x]").onclick=close;
  const ok=ov.querySelector("[data-ok]");
  if(ok){ ok.textContent=cta; ok.onclick=()=>{ if(onOk&&onOk()!==false) close(); }; }
}
function modalForm(titulo,sub,campos,cta,onOk){
  const {ov,close}=baseModal('<h3></h3><p class="m-sub"></p>'+campos+
   '<div class="modal-acts"><button class="btn btn-ghost btn-sm" data-x>Cancelar</button>'+
   '<button class="btn btn-primary btn-sm" data-ok></button></div>');
  ov.querySelector("h3").textContent=titulo;
  ov.querySelector(".m-sub").textContent=sub;
  ov.querySelector("[data-x]").onclick=close;
  const ok=ov.querySelector("[data-ok]"); ok.textContent=cta;
  ok.onclick=()=>{ if(onOk()!==false) close(); };
  const f=ov.querySelector("input,textarea,select"); if(f) f.focus();
}
function mostrarQR(){
  const url=location.href.split("#")[0];
  const {ov}=baseModal('<div class="qr-wrap"><h3 style="margin-bottom:6px">Acesse o Underfy</h3>'+
   '<p class="m-sub">Aponte a câmera do celular</p><div id="qrbox"></div>'+
   '<p class="qr-url">'+esc(url)+'</p>'+
   '<div class="modal-acts" style="justify-content:center"><button class="btn btn-ghost btn-sm" data-x>Fechar</button>'+
   '<button class="btn btn-primary btn-sm" id="qrCopy">Copiar link</button></div></div>');
  ov.querySelector("[data-x]").onclick=()=>ov.remove();
  ov.querySelector("#qrCopy").onclick=()=>copiar(url,"Link copiado.");
  const box=ov.querySelector("#qrbox");
  const gerar=()=>{ try{ new QRCode(box,{text:url,width:230,height:230,correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ box.innerHTML='<p style="color:#120E16;font-family:var(--fd);max-width:230px;line-height:1.5">Sem internet para gerar o QR. Use o link abaixo.</p>'; } };
  if(window.QRCode) gerar();
  else{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload=gerar; s.onerror=gerar; document.head.appendChild(s);
  }
}

let yt=null,ytPronto=false,ytFalhou=false,pendente=null;
let atual=null,tocandoAgora=false,tick=null,simSec=0,simTotal=200;
let aleatorio=false,pausaManual=false,ytApi=false,errosSeguidos=0,syncFeito=false;
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const d2s=d=>{const p=String(d||"").split(":");return p.length===2?(+p[0])*60+(+p[1]):200;};

window.onYouTubeIframeAPIReady=function(){
  ytApi=true;
  yt=new YT.Player("ytFrame",{height:"169",width:"300",videoId:REAL[0].vid,
   playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,playsinline:1,fs:0},
   events:{
     onReady:()=>{ytPronto=true; if(pendente){const p=pendente;pendente=null;tocar(p);}},
     onStateChange:e=>{
       if(e.data===1){ errosSeguidos=0; pausaManual=false; setUI(true); }
       if(e.data===2) setUI(false);
       if(e.data===0) proxima(1);
     },
     onError:()=>{ const t=T(atual); errosSeguidos++;
       if(errosSeguidos<=3){ toast("O YouTube não libera “"+(t?t.t:"essa faixa")+"” fora do site dele. Indo para a próxima."); proxima(1); }
       else{ toast("Várias faixas seguidas falharam. Confira a conexão."); setUI(false); } }
   }});
  iniciarSync();
};
function iniciarSync(){
  if(syncFeito||!ytApi||!USER) return; syncFeito=true;
  setTimeout(()=>sincronizarPlaylist(false),1200);
}
setTimeout(()=>{ if(!ytPronto) ytFalhou=true; },8000);

function setUI(v){
  tocandoAgora=v;
  document.getElementById("plWave").classList.toggle("static",!v);
  document.getElementById("plIcon").innerHTML=v?'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>':'<path d="M7 4l13 8-13 8z"/>';
  clearInterval(tick); if(v) tick=setInterval(prog,500);
  atualizarMini();
  try{ if("mediaSession" in navigator) navigator.mediaSession.playbackState=v?"playing":"paused"; }catch(e){}
}
function prog(){
  const t=T(atual); if(!t) return;
  let c,d;
  if(t.real&&yt&&yt.getDuration){c=yt.getCurrentTime()||0;d=yt.getDuration()||0;}
  else{simSec=(simSec+.5)%simTotal;c=simSec;d=simTotal;}
  if(!d) return;
  document.getElementById("plFill").style.width=(c/d*100)+"%";
  document.getElementById("plNow").textContent=fmt(c);
  document.getElementById("plDur").textContent=fmt(d);
  if(mini&&!mini.closed){ const b=mini.document.getElementById("mF"); if(b) b.style.width=(c/d*100)+"%"; }
}
function setArt(t){
  const holder=document.getElementById("ytHolder"),img=document.getElementById("plImg");
  if(t.real){ holder.classList.add("on"); if(img) img.style.display="none"; }
  else{
    holder.classList.remove("on");
    const tmp=document.createElement("div"); tmp.innerHTML=svgCover(t.art);
    const n=tmp.firstElementChild; n.id="plImg"; n.classList.remove("cover");
    n.style.cssText="width:100%;height:100%;display:block";
    if(img) img.replaceWith(n);
  }
}
function tocar(id){
  const t=T(id); if(!t) return;
  atual=id;
  document.getElementById("plTitle").textContent=t.t;
  document.getElementById("plArtist").textContent=t.a;
  document.getElementById("plLike").classList.toggle("on",DADOS.curtidas.includes(id));
  setArt(t);
  if(t.au) descobrir(t.au);
  DADOS.ultima=id; DADOS.recentes=[id].concat((DADOS.recentes||[]).filter(x=>x!==id)).slice(0,24); salvar();
  atualizarMini(); sessaoMidia();
  if(t.real){
    if(!ytPronto){ if(!ytFalhou){pendente=id;toast("Carregando o player do YouTube…");return;}
      window.open("https://www.youtube.com/watch?v="+t.vid,"_blank","noopener");
      toast("Sem conexão com o YouTube. Abri em outra aba."); return; }
    yt.loadVideoById(t.vid); yt.playVideo(); setUI(true);
  } else {
    if(yt&&ytPronto&&yt.pauseVideo) yt.pauseVideo();
    simSec=0; simTotal=d2s(t.dur);
    document.getElementById("plDur").textContent=t.dur||"0:00";
    setUI(true);
  }
  render();
}
function proxima(dir){
  const t=T(atual);
  const lista=(t&&t.real)?((filtroLista!==null&&(t.pl||0)===filtroLista)?idsDaLista(filtroLista):idsReais):obras.filter(o=>o.tipo==="musica").map(o=>o.id);
  if(!lista.length) return;
  if(aleatorio&&dir!==-1&&lista.length>2){ let r; do{ r=lista[Math.floor(Math.random()*lista.length)]; }while(r===atual); tocar(r); return; }
  let i=lista.indexOf(atual); if(i<0)i=0;
  i=(i+(dir===-1?-1:1)+lista.length)%lista.length;
  tocar(lista[i]);
}
function alternar(){
  if(!atual||!T(atual)){ tocar(DADOS.ultima&&T(DADOS.ultima)?DADOS.ultima:idsReais[0]); return; }
  const t=T(atual);
  if(t.real){
    if(!ytPronto) return;
    const tocando=yt.getPlayerState?yt.getPlayerState()===1:tocandoAgora;
    if(tocando){ pausaManual=true; yt.pauseVideo(); } else { pausaManual=false; yt.playVideo(); }
  } else { pausaManual=tocandoAgora; setUI(!tocandoAgora); }
}

/* ---------- controles do sistema (tela de bloqueio, fone, teclado) ---------- */
function sessaoMidia(){
  if(!("mediaSession" in navigator)||!window.MediaMetadata) return;
  const t=T(atual); if(!t) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.t,artist:t.a,album:"Underfy",
      artwork:t.real?[{src:thumb(t.vid,"hqdefault"),sizes:"480x360",type:"image/jpeg"}]:[]});
    [["play",alternar],["pause",alternar],["previoustrack",()=>proxima(-1)],["nexttrack",()=>proxima(1)]]
      .forEach(([k,f])=>{ try{ navigator.mediaSession.setActionHandler(k,f); }catch(e){} });
  }catch(e){}
}

/* ---------- ao voltar para o app, retoma de onde o navegador pausou ---------- */
let estavaTocando=false;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ estavaTocando=tocandoAgora; return; }
  const t=T(atual);
  if(estavaTocando&&!pausaManual&&t&&t.real&&ytPronto&&yt.getPlayerState&&yt.getPlayerState()===2){
    try{ yt.playVideo(); }catch(e){}
  }
});

function atualizarMini(){
  if(!mini||mini.closed) return;

    mini._id=atual;

function ligarPlayer(){
  document.getElementById("plPlay").onclick=alternar;
  document.getElementById("plMini").onclick=()=>abrirMini();
  document.getElementById("plNext").onclick=()=>proxima(1);
  document.getElementById("plPrev").onclick=()=>proxima(-1);
  document.getElementById("plLike").onclick=e=>{
    if(!atual){ toast("Escolha uma faixa primeiro."); return; }
    const i=DADOS.curtidas.indexOf(atual);
    if(i<0){ DADOS.curtidas.push(atual); xp(2,"curtida"); } else DADOS.curtidas.splice(i,1);
    salvar(); e.currentTarget.classList.toggle("on",DADOS.curtidas.includes(atual));
    if(view==="biblioteca") render();
  };
  document.getElementById("plBar").onclick=e=>{
    const t=T(atual); if(!t) return;
    const r=e.currentTarget.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    if(t.real&&ytPronto&&yt.getDuration) yt.seekTo(yt.getDuration()*p,true); else simSec=simTotal*p;
    prog();
  };
  document.getElementById("plArt").onclick=e=>{
    const t=T(atual);
    if(!t||!t.real){ toast("Vídeo só nas faixas do catálogo do YouTube."); return; }
    e.currentTarget.classList.toggle("big");
  };
  document.getElementById("globalSearch").addEventListener("input",e=>{
    busca=e.target.value.trim().toLowerCase();
    if(busca&&view!=="buscar"){ ir("buscar"); document.getElementById("globalSearch").focus(); return; }
    if(view==="buscar") render();
  });
  main().addEventListener("scroll",()=>document.getElementById("top").classList.toggle("stuck",main().scrollTop>6));
  fillWave(document.getElementById("plWave"),18);
}

/* =================================================================
   16. TELAS DE CONTA
   ================================================================= */
const card=()=>document.getElementById("authCard");
let abaAuth="entrar";
function seloModo(){
  const n=DB.modo==="nuvem";
  return '<span class="modo'+(n?" nuvem":"")+'"><i></i>'+(n?"banco de dados na nuvem":"modo local · salvo neste aparelho")+'</span>';
}
function telaAuth(){
  const reg=abaAuth==="criar", nuvem=DB.modo==="nuvem";
  card().innerHTML=
   '<div class="auth-tabs" role="tablist"><button role="tab" aria-selected="'+(!reg)+'" class="'+(reg?"":"on")+'" id="tbEntrar">Entrar</button>'+
   '<button role="tab" aria-selected="'+reg+'" class="'+(reg?"on":"")+'" id="tbCriar">Criar conta</button></div>'+
   '<h2>'+(reg?"Crie sua conta":"Entrar")+'</h2>'+
   '<p class="sub">'+(reg?"Escolha um nome de usuário e uma senha. Leva dez segundos.":"Use o usuário e a senha que você criou.")+'</p>'+
   '<div class="field"><label for="auUser">Usuário</label>'+
     '<input id="auUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" placeholder="ex: vitor.beats">'+
     (reg?'<p class="hint">De 3 a 20 caracteres: letras, números, ponto, hífen ou sublinhado.</p>':'')+'</div>'+
   '<div class="field"><label for="auPw">Senha</label>'+
     '<input id="auPw" type="password" autocomplete="'+(reg?"new-password":"current-password")+'" placeholder="'+(reg?"mínimo de 6 caracteres":"sua senha")+'"></div>'+
   (reg?'<div class="field"><label for="auPw2">Repita a senha</label><input id="auPw2" type="password" autocomplete="new-password"></div>':'')+
   '<p class="auth-err" id="auErr" role="alert"></p>'+
   '<button class="btn btn-primary btn-block" id="auGo">'+(reg?"Criar conta":"Entrar no Underfy")+'</button>'+
   '<div class="auth-note">'+seloModo()+'<br>'+(nuvem
     ?"Sua conta e tudo que você fizer ficam salvos no banco de dados. Entre de qualquer aparelho com o mesmo usuário e senha."
     :"O banco de dados na nuvem ainda não está ligado neste endereço, então a conta fica guardada neste navegador.")+'</div>';
  const $=id=>document.getElementById(id);
  $("tbEntrar").onclick=()=>{ abaAuth="entrar"; telaAuth(); };
  $("tbCriar").onclick=()=>{ abaAuth="criar"; telaAuth(); };
  const rotulo=reg?"Criar conta":"Entrar no Underfy";
  const go=async()=>{
    const u=$("auUser").value.trim(), p=$("auPw").value, err=$("auErr"), bt=$("auGo");
    err.textContent="";
    if(reg){
      const e=validarUsuario(u); if(e){ err.textContent=e; return; }
      if(p.length<6){ err.textContent="A senha precisa ter pelo menos 6 caracteres."; return; }
      if(p!==$("auPw2").value){ err.textContent="As duas senhas não são iguais."; return; }
    } else if(!u||!p){ err.textContent="Digite o usuário e a senha."; return; }
    bt.disabled=true; bt.textContent=reg?"Criando a conta…":"Entrando…";
    try{
      const r=reg?await DB.registrar(u,p):await DB.entrar(u,p);
      await abrirApp(r.nome,reg);
    }catch(e){
      err.textContent=erroAuth(e); bt.disabled=false; bt.textContent=rotulo;
    }
  };
  $("auGo").onclick=go;
  ["auUser","auPw","auPw2"].forEach(id=>{ const el=$(id); if(el) el.onkeydown=e=>{ if(e.key==="Enter") go(); }; });
  $("auUser").focus();
}
function modalSenha(){
  const {ov,close}=baseModal('<h3>Trocar senha</h3><p class="m-sub"></p>'+
   '<div class="field"><label for="snA">Senha atual</label><input id="snA" type="password" autocomplete="current-password"></div>'+
   '<div class="field"><label for="snN">Nova senha</label><input id="snN" type="password" autocomplete="new-password" placeholder="mínimo de 6 caracteres"></div>'+
   '<div class="field"><label for="snN2">Repita a nova senha</label><input id="snN2" type="password" autocomplete="new-password"></div>'+
   '<p class="auth-err" id="snErr" role="alert"></p>'+
   '<div class="modal-acts"><button class="btn btn-ghost btn-sm" data-x>Cancelar</button>'+
   '<button class="btn btn-primary btn-sm" id="snGo">Salvar nova senha</button></div>');
  ov.querySelector(".m-sub").textContent="Conta "+USER+".";
  ov.querySelector("[data-x]").onclick=close;
  const q=id=>ov.querySelector("#"+id);
  q("snGo").onclick=async()=>{
    const a=q("snA").value, n=q("snN").value, err=q("snErr");
    if(!a){ err.textContent="Digite a senha atual."; return; }
    if(n.length<6){ err.textContent="A nova senha precisa ter pelo menos 6 caracteres."; return; }
    if(n!==q("snN2").value){ err.textContent="As duas senhas novas não são iguais."; return; }
    q("snGo").disabled=true;
    try{ await DB.trocarSenha(a,n); close(); toast("Senha alterada."); }
    catch(e){ err.textContent=(e&&/credential|wrong-password|credencial/.test(String(e.code)))?"A senha atual não confere.":erroAuth(e); q("snGo").disabled=false; }
  };
  q("snA").focus();
}
function aplicarVagas(){
  (DADOS.vagas||[]).forEach(v=>{
    const [pid,i]=String(v).split(":"), pr=projetos.find(x=>x.id===pid);
    if(pr&&pr.slots[i]&&!pr.slots[i].ok){ pr.slots[i].ok=true; pr.slots[i].quem="eu"; }
  });
}
function pintarUltima(){
  const t=DADOS.ultima?T(DADOS.ultima):null; if(!t||atual) return;
  document.getElementById("plTitle").textContent=t.t;
  document.getElementById("plArtist").textContent=t.a+" · toque em play para continuar";
}
async function abrirApp(u,novo){
  USER=u;
  let d=null; try{ d=await DB.lerDados(); }catch(e){}
  DADOS=Object.assign(dadosPadrao(),d||{});
  ["curtidas","salvos","seguindo","playlists","descobertos","eventos","vagas","recentes"].forEach(k=>{ if(!Array.isArray(DADOS[k])) DADOS[k]=[]; });
  if(!DADOS.coments||typeof DADOS.coments!=="object") DADOS.coments={};
  aplicarVagas();
  document.getElementById("auth").hidden=true;
  document.getElementById("app").hidden=false;
  montarNav(); ligarPlayer(); ir("inicio"); pintarUltima();
  toast(novo?"Conta criada. Bem-vindo ao Underfy, "+u+".":"Bem-vindo de volta, "+u+".");
  DB.lerCatalogo().then(c=>{
    if(c&&c.playlist===PLAYLIST_ID&&Array.isArray(c.faixas)&&c.faixas.length&&FONTE_CAT!=="playlist"){ aplicarCatalogo(c.faixas,"nuvem"); pintarUltima(); }
  }).catch(()=>{});
  DB.listarPosts().then(l=>{ postsUsuarios=l||[]; if(view==="feed") render(); }).catch(()=>{});
  completarMeta().catch(()=>{});
  iniciarSync();
}
document.getElementById("btnQR").onclick=mostrarQR;

/* =================================================================
   17. BOOT
   ================================================================= */
(async function(){
  card().innerHTML='<p class="auth-wait">Conectando ao banco de dados…</p>';
  await DB.iniciar();
  let s=null;
  try{ s=await Promise.race([DB.sessao(),new Promise(r=>setTimeout(()=>r(null),7000))]); }catch(e){}
  if(s) await abrirApp(s.nome,false); else telaAuth();
  if(DB.falhou) toast("O banco de dados não respondeu. Usando o modo local por enquanto.");
})();
</script>
