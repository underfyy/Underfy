<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underfy</title>
<meta name="theme-color" content="#120E16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 156 110'%3E%3Cpath d='M6 55 L20 55 L26 44 L32 66 L38 38 L44 72 L50 30 L50 66 C50 90 96 90 96 66 L96 26 L103 78 L110 34 L117 70 L124 46 L131 60 L138 55 L150 55' fill='none' stroke='%239D4EDD' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120E16; --surface:#1A1523; --surface-2:#221B2E; --surface-3:#2C2340;
  --line:#2E2540; --purple:#9D4EDD; --cyan:#00F5D4;
  --text:#F3EFF5; --muted:#8B8594;
  --radius:14px; --radius-sm:8px;
  --font-display:"Chakra Petch",system-ui,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;letter-spacing:-.01em}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
::selection{background:var(--purple);color:#fff}
[hidden]{display:none !important}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#3d3054}

.mark{display:block;overflow:visible}
.mark path{fill:none;stroke:currentColor;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.lockup{display:flex;align-items:center;gap:.55em}
.lockup .wordmark{font-family:var(--font-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;transform:skewX(-6deg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:99px;font-family:var(--font-display);font-weight:600;letter-spacing:.02em;transition:transform .12s ease,background .18s ease,border-color .18s ease,color .18s ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:#ad63e8}
.btn-ghost{border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple)}
.btn-cyan{background:var(--cyan);color:#08201c}
.btn-cyan:hover{background:#4dfae0}
.btn-sm{padding:.44rem .95rem;font-size:.87rem}

/* shell */
.ap{position:fixed;inset:0;display:grid;background:var(--bg);grid-template-columns:236px 1fr;grid-template-rows:1fr 78px;grid-template-areas:"side main" "player player"}
@media(max-width:900px){.ap{grid-template-columns:1fr;grid-template-rows:1fr auto auto;grid-template-areas:"main" "player" "side"}}

.ap-side{grid-area:side;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.ap-side .lockup{color:var(--purple);font-size:20px;padding:6px 10px 22px}
.ap-side .wordmark{color:var(--text);font-size:20px}
.ap-nav{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);font-family:var(--font-display);font-weight:500;transition:background .16s ease,color .16s ease;width:100%;text-align:left}
.navbtn svg{width:20px;height:20px;flex:0 0 20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:var(--text);background:var(--surface-2)}
.navbtn.on{color:var(--purple);background:rgba(157,78,221,.12)}
.side-note{margin-top:auto;border:1px solid var(--line);border-radius:var(--radius);padding:14px;font-size:.82rem;color:var(--muted)}
.side-note b{display:block;font-family:var(--font-display);color:var(--text);font-size:.9rem;margin-bottom:5px}
.side-note .btn{margin-top:11px;width:100%}
@media(max-width:900px){
  .ap-side{flex-direction:row;border-right:none;border-top:1px solid var(--line);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:#15111d}
  .ap-side .lockup,.side-note{display:none}
  .ap-nav{flex-direction:row;width:100%;gap:0}
  .navbtn{flex-direction:column;gap:4px;font-size:.66rem;padding:7px 2px;justify-content:center;text-align:center;letter-spacing:0}
  .navbtn svg{width:21px;height:21px;flex:0 0 21px}
}

.ap-main{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.glow{position:absolute;top:0;left:0;right:0;height:420px;pointer-events:none;transition:opacity .3s ease;background:linear-gradient(180deg,rgba(157,78,221,.22),rgba(157,78,221,0) 78%)}
.ap-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:13px 26px;background:rgba(18,14,22,.72);backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .25s ease,background .25s ease}
.ap-top.stuck{border-bottom-color:var(--line);background:rgba(18,14,22,.94)}
@media(max-width:640px){.ap-top{padding:11px 16px}}
.ap-search{flex:1;max-width:400px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 16px;transition:border-color .18s ease}
.ap-search:focus-within{border-color:var(--purple)}
.ap-search input{background:none;border:none;outline:none;width:100%;font-size:.93rem;min-width:0}
.ap-search input::placeholder{color:var(--muted)}
.ap-search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 17px}
.ap-me{margin-left:auto;display:flex;align-items:center;gap:10px}
.ap-page{padding:22px 26px 40px;position:relative;z-index:1}
@media(max-width:640px){.ap-page{padding:18px 16px 34px}}
.mobile-logo{display:none}
@media(max-width:900px){.mobile-logo{display:flex;color:var(--purple);font-size:17px}.mobile-logo .wordmark{color:var(--text);font-size:17px}.ap-search{max-width:none}}
@media(max-width:560px){.ap-top .mobile-logo{display:none}}
.ap-h{font-size:1.55rem;margin-bottom:6px}
.ap-sub{color:var(--muted);font-size:.94rem;margin-bottom:24px;max-width:44em}

/* capas */
.cover{width:100%;aspect-ratio:1;display:block;border-radius:7px;background:var(--surface-2);object-fit:cover}
.cover.round{border-radius:99px}

.greet{font-size:clamp(1.5rem,3.6vw,2rem);margin-bottom:22px}

/* destaque */
.feat{display:flex;align-items:center;gap:24px;margin-bottom:34px;background:linear-gradient(110deg,rgba(157,78,221,.3),rgba(0,245,212,.07) 70%,transparent);border:1px solid var(--line);border-radius:18px;padding:22px}
.feat-art{width:172px;flex:0 0 172px;display:grid;grid-template-columns:1fr 1fr;gap:2px;border-radius:10px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.feat-art img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
.feat-txt{min-width:0}
.feat-tag{font-family:var(--font-display);font-size:.76rem;letter-spacing:.12em;color:var(--cyan);margin-bottom:9px;display:block}
.feat h2{font-size:clamp(1.4rem,3.4vw,2.1rem);margin-bottom:8px}
.feat p{color:var(--muted);font-size:.93rem;margin-bottom:18px;max-width:36em}
.feat-acts{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:720px){.feat{flex-direction:column;align-items:flex-start;gap:18px;padding:18px}.feat-art{width:140px;flex:0 0 auto}}

/* atalhos */
.qp{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:38px}
@media(max-width:1100px){.qp{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.qp{grid-template-columns:1fr}}
.qpc{display:flex;align-items:center;gap:13px;background:var(--surface-2);border-radius:7px;overflow:hidden;height:64px;transition:background .18s ease;text-align:left;position:relative}
.qpc:hover{background:var(--surface-3)}
.qpc .cover{width:64px;height:64px;flex:0 0 64px;border-radius:0;aspect-ratio:auto}
.qpc-txt{min-width:0;padding-right:52px}
.qpc strong{display:block;font-family:var(--font-display);font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qpc span{font-size:.79rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qpc .fab{position:absolute;right:12px;top:50%;transform:translateY(-50%) scale(.85);opacity:0;transition:.18s ease}
.qpc:hover .fab{opacity:1;transform:translateY(-50%) scale(1)}

/* prateleiras */
.shelf{margin-bottom:34px}
.shelf-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.shelf-head h2{font-size:1.28rem}
.shelf-head p{font-size:.85rem;color:var(--muted);margin-left:auto;white-space:nowrap}
@media(max-width:640px){.shelf-head p{display:none}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:168px;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding-bottom:8px;margin:0 -8px;padding-inline:8px}
@media(max-width:560px){.rail{grid-auto-columns:143px}}
.rail>*{scroll-snap-align:start}
.tile{padding:10px;border-radius:9px;transition:background .18s ease;text-align:left;width:100%}
.tile:hover{background:var(--surface-2)}
.tile.artist{text-align:center}
.tile-cover{position:relative;margin-bottom:11px}
.tile-cover .cover{box-shadow:0 8px 22px rgba(0,0,0,.4)}
.fab{width:42px;height:42px;border-radius:99px;background:var(--purple);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .16s ease,opacity .16s ease,background .16s ease;flex:0 0 42px}
.fab svg{width:15px;height:15px;fill:#fff}
.fab:hover{background:#ad63e8}
.tile-cover .fab{position:absolute;right:8px;bottom:8px;opacity:0;transform:translateY(8px)}
.tile:hover .tile-cover .fab,.tile:focus-within .tile-cover .fab{opacity:1;transform:none}
@media(hover:none){.tile-cover .fab{opacity:1;transform:none}.qpc .fab{opacity:1;transform:translateY(-50%)}}
.tile strong{display:block;font-family:var(--font-display);font-size:.93rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.tile span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.playing strong{color:var(--cyan)}
.slot-open{color:var(--cyan)}
.pill-open{position:absolute;left:8px;top:8px;background:rgba(0,245,212,.92);color:#08201c;font-family:var(--font-display);font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px}
.pill-yt{position:absolute;left:8px;top:8px;background:rgba(18,14,22,.82);color:var(--text);font-family:var(--font-display);font-size:.66rem;font-weight:600;letter-spacing:.05em;padding:3px 8px;border-radius:99px;backdrop-filter:blur(4px)}

/* lista de faixas */
.tracklist{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;max-width:820px}
.trow{display:flex;align-items:center;gap:13px;padding:9px 12px;width:100%;text-align:left;transition:background .16s ease;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--surface-2)}
.trow .num{width:22px;text-align:right;color:var(--muted);font-size:.85rem;font-family:var(--font-display);flex:0 0 22px}
.trow img{width:44px;height:44px;border-radius:5px;object-fit:cover;flex:0 0 44px;background:var(--surface-2)}
.trow .tinfo{min-width:0;flex:1}
.trow strong{display:block;font-family:var(--font-display);font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.playing strong{color:var(--cyan)}
.trow .src{font-size:.72rem;color:var(--muted);font-family:var(--font-display);white-space:nowrap}
@media(max-width:560px){.trow .src{display:none}}

/* avatar */
.av{border-radius:99px;display:grid;place-items:center;flex:0 0 auto;font-family:var(--font-display);font-weight:700;color:#fff;width:44px;height:44px;font-size:.9rem;position:relative}
.av.sm{width:34px;height:34px;font-size:.75rem}
.av.lg{width:82px;height:82px;font-size:1.6rem}
.av .on-dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:99px;background:var(--cyan);border:2.5px solid var(--bg)}

/* feed */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;max-width:720px}
.post-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.post-who strong{display:block;font-family:var(--font-display);font-size:.98rem}
.post-who span{font-size:.82rem;color:var(--muted)}
.badge{margin-left:auto;font-family:var(--font-display);font-size:.72rem;letter-spacing:.06em;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.letra{color:var(--purple);border-color:rgba(157,78,221,.45);background:rgba(157,78,221,.1)}
.badge.beat{color:var(--cyan);border-color:rgba(0,245,212,.4);background:rgba(0,245,212,.08)}
.post-title{font-family:var(--font-display);font-size:1.12rem;font-weight:600;margin-bottom:8px}
.post-verse{border-left:2px solid var(--purple);padding:2px 0 2px 14px;margin:12px 0 14px;font-size:1rem;line-height:1.7;white-space:pre-line}
.post-audio{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0 6px}
.post-audio .meta{font-size:.83rem;color:var(--muted);white-space:nowrap}
.post-audio .wave{flex:1;min-width:0;overflow:hidden}
.audio-info{font-size:.84rem;color:var(--muted);margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tag-chip{font-size:.79rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.callout{display:flex;align-items:center;gap:9px;font-size:.88rem;background:rgba(0,245,212,.06);border:1px dashed rgba(0,245,212,.35);color:var(--cyan);padding:9px 13px;border-radius:var(--radius-sm);margin-bottom:14px}
.callout b{font-weight:600;color:var(--text)}
.post-acts{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:13px;flex-wrap:wrap}
.act{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;color:var(--muted);font-size:.87rem;transition:color .16s ease,background .16s ease}
.act svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act:hover{background:var(--surface-2);color:var(--text)}
.act.liked{color:var(--cyan)}
.act.liked svg{fill:var(--cyan);stroke:var(--cyan)}
.act-collab{margin-left:auto;color:var(--purple);border:1px solid rgba(157,78,221,.4);font-family:var(--font-display);font-weight:600}
.act-collab:hover{background:var(--purple);color:#fff}

.wave{display:flex;align-items:center;gap:2px;height:26px}
.wave i{display:block;flex:1 1 auto;min-width:2px;max-width:4px;border-radius:99px;background:var(--purple);height:30%;animation:bounce 1s ease-in-out infinite alternate}
.wave.static i{animation-play-state:paused}
@keyframes bounce{to{height:100%}}
@media(prefers-reduced-motion:reduce){.wave i{animation:none;height:58%}}

/* buscar */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.88rem;transition:all .16s ease}
.chip:hover{color:var(--text);border-color:var(--purple)}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.sec-h{font-size:1.15rem;margin:26px 0 13px}
.grid-art{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.art-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;text-align:center;transition:border-color .18s ease,background .18s ease}
.art-card:hover{border-color:var(--purple);background:var(--surface-2)}
.art-card .av,.art-card .cover{margin:0 auto 13px}
.art-card .cover{width:82px;height:82px;aspect-ratio:auto}
.art-card strong{display:block;font-family:var(--font-display);font-size:1rem}
.art-card .role{font-size:.85rem;color:var(--purple);margin:3px 0 2px}
.art-card .city{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.art-card .btn{width:100%}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:42px 24px;text-align:center;color:var(--muted);max-width:720px}
.empty strong{display:block;color:var(--text);font-family:var(--font-display);font-size:1.05rem;margin-bottom:6px}

/* colabs */
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px;max-width:820px}
.proj-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.proj-head h3{font-size:1.15rem}
.proj-head p{font-size:.85rem;color:var(--muted)}
.prog{margin-left:auto;text-align:right;min-width:120px}
.prog b{font-family:var(--font-display);font-size:.85rem;color:var(--cyan)}
.prog-bar{height:5px;border-radius:99px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:99px;transition:width .5s ease}
.slots{display:flex;flex-direction:column;gap:9px}
.slot{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid transparent}
.slot.open{background:transparent;border:1px dashed var(--line)}
.slot-role{font-family:var(--font-display);font-size:.88rem;min-width:90px;color:var(--muted)}
.slot strong{font-size:.92rem}
.slot .ok{margin-left:auto;color:var(--purple);font-size:.8rem;font-family:var(--font-display)}
.slot .btn{margin-left:auto}
.slot-open-lbl{color:var(--muted);font-size:.9rem;font-style:italic}

/* perfil */
.prof-head{display:flex;gap:22px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.prof-head h2{font-size:1.7rem}
.prof-head .role{color:var(--purple);font-family:var(--font-display);font-size:.95rem}
.prof-head .city{color:var(--muted);font-size:.88rem}
.prof-bio{color:var(--muted);max-width:44em}
.stats{display:flex;gap:28px;margin:24px 0;padding:18px 0;border-block:1px solid var(--line);flex-wrap:wrap;max-width:820px}
.stat b{display:block;font-family:var(--font-display);font-size:1.35rem}
.stat span{font-size:.82rem;color:var(--muted)}

/* player */
.ap-player{grid-area:player;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px}
@media(max-width:900px){.ap-player{padding:9px 12px;gap:10px}}
.pl-info{display:flex;align-items:center;gap:12px;min-width:0;width:250px}
@media(max-width:900px){.pl-info{width:auto;flex:1}}
.pl-art{width:50px;height:50px;flex:0 0 50px;border-radius:6px;overflow:hidden;position:relative;background:var(--surface-2);cursor:pointer}
.pl-art img,.pl-art svg{width:100%;height:100%;object-fit:cover;display:block}
#ytHolder{position:absolute;inset:0;display:none;pointer-events:none}
#ytHolder.on{display:block}
#ytHolder iframe{position:absolute;top:50%;left:50%;width:300px;height:169px;border:0;transform:translate(-50%,-50%) scale(.296);transform-origin:center}
.pl-art.big{position:fixed;right:20px;bottom:96px;width:320px;height:180px;z-index:150;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);border:1px solid var(--line)}
.pl-art.big #ytHolder iframe{transform:translate(-50%,-50%) scale(1.067)}
@media(max-width:900px){.pl-art.big{right:12px;left:12px;width:auto;bottom:auto;top:70px;height:auto;aspect-ratio:16/9}
  .pl-art.big #ytHolder iframe{transform:translate(-50%,-50%) scale(1.2)}}
.pl-info strong{display:block;font-family:var(--font-display);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

let gid=0;
function svgCover(n,cls){
  const p=PAL[n%6], fg=p[0], bg=p[1], pat=n%6, id="c"+(gid++);
  let art="";
  if(pat===0){art='<circle cx="30" cy="32" r="34" fill="'+fg+'" opacity=".55"/><circle cx="72" cy="74" r="24" fill="'+fg+'" opacity=".32"/>';}
  else if(pat===1){let b="";for(let i=0;i<11;i++){const h=18+((i*37)%62);b+='<rect x="'+(8+i*8)+'" y="'+(50-h/2)+'" width="4.5" height="'+h+'" rx="2.2" fill="'+fg+'" opacity=".8"/>';}art=b;}
  else if(pat===2){let s='<g transform="rotate(-32 50 50)">';for(let i=0;i<7;i++){s+='<rect x="-30" y="'+(i*18-10)+'" width="170" height="7" fill="'+fg+'" opacity="'+(0.18+i*0.09).toFixed(2)+'"/>';}art=s+'</g>';}
  else if(pat===3){art='<g transform="translate(50 52) scale(0.62) translate(-78 -55)" opacity=".85"><use href="#uf-mark" fill="none" stroke="'+fg+'" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>';}
  else if(pat===4){let d="";for(let y=0;y<7;y++)for(let x=0;x<7;x++){d+='<circle cx="'+(12+x*13)+'" cy="'+(12+y*13)+'" r="'+(1.6+((x+y)%4))+'" fill="'+fg+'" opacity=".55"/>';}art=d;}
  else{art='<path d="M-5 78 Q 50 18 105 78" fill="none" stroke="'+fg+'" stroke-width="8" opacity=".85"/><path d="M-5 96 Q 50 36 105 96" fill="none" stroke="'+fg+'" stroke-width="8" opacity=".5"/><path d="M-5 60 Q 50 0 105 60" fill="none" stroke="'+fg+'" stroke-width="8" opacity=".3"/>';}

    '<rect width="100" height="100" fill="url(#'+id+')"/>'+art+'</svg>';
}

  if(s===0){el.dataset.step="1";el.src=thumb(el.dataset.vid,"hq720");}
  else if(s===1){el.dataset.step="2";el.src=thumb(el.dataset.vid,"mqdefault");}
},true);

function coverOf(tr,cls){ return tr.real ? ytImg(tr.vid,cls) : svgCover(tr.art,cls); }

/* ===================== BUSCA DE METADADOS NO YOUTUBE ===================== */
function limpa(s){
  return String(s)
    .replace(/\((?:official|oficial)[^)]*\)/ig,"")
    .replace(/\[[^\]]*\]/g,"")
    .replace(/\b(official\s*(music\s*)?video|videoclipe\s*oficial|clipe\s*oficial|official\s*audio|lyric\s*video|visualizer|prod\.?\s*by[^,|]*)\b/ig,"")
    .replace(/\|.*$/,"")
    .replace(/\s{2,}/g," ").trim().replace(/[-–—|,]\s*$/,"").trim();
}
async function puxarMetadados(){
  const jobs=REAL.map(async(r,i)=>{
    const u="https://www.youtube.com/oembed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+r.vid)+"&format=json";
    const res=await fetch(u);
    if(!res.ok) throw new Error("oembed");
    const d=await res.json();
    let artista=String(d.author_name||"").replace(/\s*-\s*Topic$/i,"").replace(/VEVO$/i,"").trim();
    let titulo=String(d.title||r.t);
    const partes=titulo.split(/\s+[-–—]\s+/);
    if(partes.length>=2 && partes[0].trim().length<=40){
      artista=limpa(partes[0]);
      titulo=limpa(partes.slice(1).join(" - "));
    } else { titulo=limpa(titulo); }
    const tr=CAT["y"+i];
    tr.t=titulo||r.t; tr.a=artista||r.a; tr.ok=true;
  });
  const res=await Promise.allSettled(jobs);
  const bons=res.filter(x=>x.status==="fulfilled").length;
  if(bons>0) render();
  return bons;
}
function artistasReais(){
  const m=new Map();
  idsReais.forEach(id=>{const tr=T(id);
    if(!m.has(tr.a)) m.set(tr.a,[]);
    m.get(tr.a).push(id);});
  return [...m.entries()].map(([nome,ids])=>({nome,ids}));
}

function openModal(titulo,sub,campos,cta,onOk){

    '<div class="modal-acts"><button class="btn btn-ghost btn-sm" data-cancel>Cancelar</button>'+

  ov.querySelector("h3").textContent=titulo;

  ov.querySelector("[data-ok]").textContent=cta;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector("[data-cancel]").onclick=close;
  ov.querySelector("[data-ok]").onclick=()=>{ if(onOk()!==false) close(); };
  ov.onclick=e=>{ if(e.target===ov) close(); };

  const f=ov.querySelector("input,textarea,select"); if(f) f.focus();
}

/* ===================== PLAYER ===================== */
let yt=null, ytPronto=false, ytFalhou=false, pendente=null;
let atual=null, tocando=false, tick=null;
let simSec=0, simTotal=200;

const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const dur2sec=d=>{const p=String(d||"").split(":");return p.length===2?(+p[0])*60+(+p[1]):200;};

window.onYouTubeIframeAPIReady=function(){
  yt=new YT.Player("ytFrame",{
    height:"169",width:"300",videoId:REAL[0].vid,
    playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,playsinline:1,fs:0},
    events:{
      onReady:()=>{ytPronto=true; if(pendente){const p=pendente;pendente=null;tocar(p);}},
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING) setUI(true);
        if(e.data===YT.PlayerState.PAUSED)  setUI(false);
        if(e.data===YT.PlayerState.ENDED)   proxima();
      },
      onError:()=>{
        toast("O YouTube não liberou essa faixa aqui. Abrindo em nova aba.");
        const tr=T(atual);
        if(tr&&tr.vid) window.open("https://www.youtube.com/watch?v="+tr.vid,"_blank","noopener");
        setUI(false);
      }
    }
  });
};
setTimeout(()=>{ if(!ytPronto){ytFalhou=true;} },7000);

function setUI(v){
  tocando=v;
  document.getElementById("plWave").classList.toggle("static",!v);
  document.getElementById("plIcon").innerHTML=v?'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>':'<path d="M7 4l13 8-13 8z"/>';
  document.getElementById("plPlay").setAttribute("aria-label",v?"Pausar":"Reproduzir");
  clearInterval(tick);
  if(v) tick=setInterval(progresso,500);
}
function progresso(){
  const tr=T(atual); if(!tr) return;
  let cur,tot;
  if(tr.real&&yt&&yt.getDuration){ cur=yt.getCurrentTime()||0; tot=yt.getDuration()||0; }
  else { simSec=(simSec+0.5)%simTotal; cur=simSec; tot=simTotal; }
  if(!tot) return;
  document.getElementById("plFill").style.width=(cur/tot*100)+"%";
  document.getElementById("plNow").textContent=fmt(cur);
  document.getElementById("plDur").textContent=fmt(tot);
}
function setArt(tr){
  const holder=document.getElementById("ytHolder");
  const img=document.getElementById("plImg");
  if(tr.real){
    holder.classList.add("on");
    if(img) img.style.display="none";
  } else {
    holder.classList.remove("on");
    const tmp=document.createElement("div"); tmp.innerHTML=svgCover(tr.art);
    const novo=tmp.firstElementChild; novo.id="plImg"; novo.style.display="block";
    novo.classList.remove("cover");
    novo.style.width="100%"; novo.style.height="100%";
    if(img) img.replaceWith(novo);
  }
}
function tocar(id){
  const tr=T(id); if(!tr) return;
  atual=id;
  document.getElementById("plTitle").textContent=tr.t;
  document.getElementById("plArtist").textContent=tr.a;
  document.getElementById("plLike").classList.remove("liked");
  setArt(tr);
  if(tr.real){
    if(ytFalhou||!ytPronto){
      if(!ytFalhou){ pendente=id; toast("Carregando o player do YouTube…"); return; }
      window.open("https://www.youtube.com/watch?v="+tr.vid,"_blank","noopener");
      toast("Sem conexão com o YouTube. Abri a faixa em outra aba.");
      return;
    }
    yt.loadVideoById(tr.vid);
    yt.playVideo();
    setUI(true);
  } else {
    if(yt&&yt.pauseVideo&&ytPronto) yt.pauseVideo();
    simSec=0; simTotal=dur2sec(tr.dur);
    document.getElementById("plDur").textContent=tr.dur;
    setUI(true);
  }
  render();
}
function proxima(dir){
  const lista=(T(atual)&&T(atual).real)?idsReais:["d1","d2","d3","d4","d5"];
  let i=lista.indexOf(atual);
  if(i<0) i=0;
  i=(i+(dir===-1?-1:1)+lista.length)%lista.length;
  tocar(lista[i]);
}
document.getElementById("plPlay").addEventListener("click",()=>{
  if(!atual){ tocar("y0"); return; }
  const tr=T(atual);
  if(tr.real&&ytPronto){ tocando?yt.pauseVideo():yt.playVideo(); }
  else setUI(!tocando);
});
document.getElementById("plNext").addEventListener("click",()=>proxima(1));
document.getElementById("plPrev").addEventListener("click",()=>proxima(-1));
document.getElementById("plLike").addEventListener("click",e=>{
  e.currentTarget.classList.toggle("liked");
  toast(e.currentTarget.classList.contains("liked")?"Adicionado às suas curtidas.":"Removido das curtidas.");
});
document.getElementById("plBar").addEventListener("click",e=>{
  const tr=T(atual); if(!tr) return;
  const r=e.currentTarget.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  if(tr.real&&ytPronto&&yt.getDuration){ yt.seekTo(yt.getDuration()*p,true); }
  else { simSec=simTotal*p; }
  progresso();
});
document.getElementById("plArt").addEventListener("click",e=>{
  const tr=T(atual);
  if(!tr||!tr.real){ toast("Vídeo só nas faixas do catálogo do YouTube."); return; }
  e.currentTarget.classList.toggle("big");
});

/* ===================== BOOT ===================== */
render();
puxarMetadados().then(n=>{
  if(n===0) toast("Sem internet: nomes e capas do YouTube não carregaram.");
}).catch(()=>{});
</script>
